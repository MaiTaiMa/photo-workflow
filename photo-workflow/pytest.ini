[pytest]
pythonpath = . app
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Unterdrückt ausschließlich die bekannte Fremdwarnung beim Import des
# unveränderten face_recognition_models-Pakets; alle anderen Warnungen bleiben sichtbar.
filterwarnings =
    ignore:pkg_resources is deprecated as an API:UserWarning:face_recognition_models
