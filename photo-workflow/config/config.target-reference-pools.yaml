# Projekt: Synology Photo Workflow
# Datei: config/config.target-reference-pools.yaml
# Zweck: Gemeinsame Zielkonfiguration für AP2 bis AP8.
#
# Diese Datei beschreibt den späteren Zielstand. Sie darf erst nach der
# phasenweisen Schema- und Code-Integration als aktive Produktivkonfiguration
# verwendet werden. AP2 validiert zunächst Pfade und Runtime; AP3 bis AP8
# schalten die jeweiligen Fachbereiche kontrolliert frei.
#
# Verbindliche Regeln:
# - Aktive Referenzen liegen ausschließlich in */reference/.
# - Neue Vorschläge liegen ausschließlich in */new_refs/ oder */new_faces/.
# - selection.json ist die alleinige Wahrheit je Referenzpool.
# - Kein Vorschlag wird automatisch aktiviert.
# - Bildbytes, Crops und Embeddings gehören nicht in selection.json, Reports
#   oder Git.
# - Modellgewichte, Caches, Logs und private Bilder gehören nicht in Git.
# - Face-Namen bleiben case-preserving, zum Beispiel Chris oder Kind1.
#
# Version: 1.5.0
# Änderungsprotokoll:
# 2026-08-09 | 1.5.0 | Zusammenführung von AP2/AP3-Zielconfig und 98AP-Regeln
# 2026-08-09 | 1.4.0 | Referenzpools, Runtime, lokale Modelle und Serienregeln

# -----------------------------------------------------------------------------
# paths
# Kanonische Wurzeln des persistenten Datenbereichs.
# Jede produktive Datei muss innerhalb von base_dir liegen. Die Anwendung muss
# diese Bedingung vor jeder Dateimutation kanonisch und symlink-sicher prüfen.
# -----------------------------------------------------------------------------
paths:
  # base_dir: Obergrenze für alle produktiven Workflowdaten.
  # Mögliche Werte: Existierender NAS-Datenordner.
  # Auswirkung: Außenpfade und Traversal werden blockiert.
  base_dir: ../NAS_EXAMPLE

  # temp_error: Quarantäne für unsichere oder fehlerhafte Batchzustände.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Fehler werden isoliert statt still weiterverarbeitet.
  temp_error: ../NAS_EXAMPLE/00_TEMP_ERROR

  # temp_sd: Eingang neuer Kamera-Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Phase 1 liest neue Batches ausschließlich aus diesem Bereich.
  temp_sd: ../NAS_EXAMPLE/01_TEMP_SD

  # temp_images: Arbeitsbereich nach erfolgreicher Eingangsprüfung.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Batchdaten bleiben vom Eingang getrennt.
  temp_images: ../NAS_EXAMPLE/02_TEMP_IMAGES

  # temp_done: Übergabebereich manuell freigegebener Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Phase 2 darf nur explizit freigegebene Batches verarbeiten.
  temp_done: ../NAS_EXAMPLE/03_TEMP_DONE

  # temp_final: Lokaler Finalisierungsbereich vor einer späteren Publikation.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Phase 3 erhält einen kontrollierten Endpunkt.
  temp_final: ../NAS_EXAMPLE/04_TEMP_FINAL

  # manual_keep_inbox: Eingang manuell markierter Keeps.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: MANUAL_KEEP bleibt vom normalen Culling getrennt.
  manual_keep_inbox: ../NAS_EXAMPLE/MANUAL_KEEP/inbox

  # manual_keep_used: Erfolgreich verarbeitete Manual-Keep-Quellen.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Verhindert doppelte Zuordnung derselben Quelle.
  manual_keep_used: ../NAS_EXAMPLE/MANUAL_KEEP/used

  # workflow_data_dir: Wurzel für Runtime, Pools, Modelle und Reports.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Persistente technische Daten bleiben vom Batch getrennt.
  workflow_data_dir: ../NAS_EXAMPLE/WORKFLOW_DATA

# -----------------------------------------------------------------------------
# workflow
# Batch-Lebenszyklus, Locking und Datumsrekonstruktion.
# -----------------------------------------------------------------------------
workflow:
  # wait_time_seconds: Stabilitätswartezeit für neue Batches.
  # Mögliche Werte: Nichtnegative Ganzzahl in Sekunden.
  # Auswirkung: Ein Batch muss während dieser Zeit unverändert bleiben.
  wait_time_seconds: 60

  # stale_lock_seconds: Maximales Alter eines verwaisten Locks.
  # Mögliche Werte: Positive Ganzzahl in Sekunden.
  # Auswirkung: Nur eindeutig alte Locks dürfen recoveryfähig sein.
  stale_lock_seconds: 43200

  # merge_strategy: Verhalten bei bereits vorhandenem Zielbatch.
  # Mögliche Werte: merge_then_fallback.
  # Auswirkung: Zuerst wird gemerged; Kollisionen erhalten einen Fallback.
  merge_strategy: merge_then_fallback

  # create_done_marker_before_move: Abschlussmarker vor einem Move schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true dokumentiert den Abschluss vor dem Übergang.
  create_done_marker_before_move: true

  # date_reconstruction: Rekonstruktion unvollständiger Batchnamen.
  # Mögliche Werte: legacy_bash oder full_year.
  # Auswirkung: Bestimmt die reproduzierbare Datumsableitung.
  date_reconstruction:
    # mode: Aktiver Rekonstruktionsmodus.
    # Mögliche Werte: legacy_bash oder full_year.
    # Auswirkung: Steuert die Bildung von YYYY-MM-DD.
    mode: legacy_bash

    # decade_prefix: Dreistelliges Präfix im legacy_bash-Modus.
    # Mögliche Werte: Genau drei Ziffern.
    # Auswirkung: Wird vor die ausgewählte Jahresziffer gesetzt.
    decade_prefix: "202"

    # year_digit_index: Index der Jahresziffer im Quellnamen.
    # Mögliche Werte: Nichtnegative Ganzzahl innerhalb des Quellnamens.
    # Auswirkung: Bestimmt das letzte Jahreszeichen.
    year_digit_index: 3

# -----------------------------------------------------------------------------
# runtime
# Alle veränderlichen Laufzeitdaten liegen ausschließlich hier.
# Config-Parsing muss diese Werte vor Locking und Verzeichnisanlage prüfen.
# -----------------------------------------------------------------------------
runtime:
  # lock_file: Globaler Lock gegen parallele produktive Läufe.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Verhindert konkurrierende Mutationen.
  lock_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/locks/.script.lock

  # state_dir: Atomare Zustandsdateien der Batchphasen.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Ermöglicht Wiederaufnahme und Recovery.
  state_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/state

  # quarantine_dir: Technische Runtime-Quarantäne.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Unsichere Artefakte werden isoliert.
  quarantine_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/quarantine

  # log_file: Normales Workflowprotokoll.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Laufereignisse werden zentral protokolliert.
  log_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/process.log

  # error_log: Fehler- und Blockierungsprotokoll.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Fehler bleiben vom normalen Lauf getrennt.
  error_log: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/error.log

  # run_summaries_dir: JSON-/CSV-Laufzusammenfassungen.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Status, Hashes und User-Actions werden sichtbar.
  run_summaries_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/run_summaries

  # calibration_batches_dir: Unveränderliche Kalibrierungsdatensätze.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Menschliche Endentscheidungen bleiben revisionsfähig.
  calibration_batches_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/calibration/batches

# -----------------------------------------------------------------------------
# models
# Lokale Modellartefakte. Gewichte, Tokenizer und Caches gehören nicht in Git.
# -----------------------------------------------------------------------------
models:
  # face_detection: Lokale YuNet-Gesichtserkennung.
  # Aktivierung erfolgt erst nach Adapter- und Pfadprüfung.
  face_detection:
    # backend: Technischer Modelladapter.
    # Mögliche Werte: opencv.
    # Auswirkung: Lädt ein lokales ONNX-Modell.
    backend: opencv

    # model_path: Lokale YuNet-Gewichtsdatei.
    # Mögliche Werte: Datei innerhalb von base_dir.
    # Auswirkung: Liefert Gesichtsboxen und Landmarken.
    model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/face/face_detection_yunet_2023mar.onnx

    # confidence_threshold: Mindestvertrauen einer Detection.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Niedrigere Treffer werden verworfen.
    confidence_threshold: 0.65

    # max_input_side: Maximale Bildseitenlänge für die Detection.
    # Mögliche Werte: Positive Ganzzahl in Pixeln.
    # Auswirkung: Begrenzt Rechenzeit und Speicherbedarf.
    max_input_side: 1600

    # nms_threshold: Schwelle für Non-Maximum-Suppression.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Reduziert doppelte Treffer.
    nms_threshold: 0.30

    # top_k: Maximale Kandidatenzahl vor der Auswahl.
    # Mögliche Werte: Positive Ganzzahl.
    # Auswirkung: Begrenzt die Kandidatenmenge.
    top_k: 5000

  # face_recognition: Lokaler SFace-Adapter.
  # Face-Embeddings dürfen nur im vorgesehenen Runtime-Cache bleiben.
  face_recognition:
    # backend: Technischer Modelladapter.
    # Mögliche Werte: opencv.
    # Auswirkung: Lädt ein lokales SFace-ONNX-Modell.
    backend: opencv

    # model_path: Lokale SFace-Gewichtsdatei.
    # Mögliche Werte: Datei innerhalb von base_dir.
    # Auswirkung: Erzeugt Laufzeit-Embeddings für Vergleiche.
    model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/face/face_recognition_sface_2021dec.onnx

    # distance_metric: Vergleichsmetrik.
    # Mögliche Werte: cosine oder l2.
    # Auswirkung: Bestimmt die Distanzberechnung.
    distance_metric: cosine

    # match_tolerance: Maximale akzeptierte Vergleichsdistanz.
    # Mögliche Werte: Kalibrierte Fließkommazahl.
    # Auswirkung: Kleinere Werte reduzieren Fehlzuordnungen.
    match_tolerance: 0.60

  # clip: Lokaler CLIP-Adapter für AP6.
  # In AP2 bis AP5 bleibt CLIP deaktiviert und verändert kein Culling.
  clip:
    # enabled: CLIP produktiv aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: Erst ab AP6 darf true verwendet werden.
    enabled: false

    # backend: Modelladapter.
    # Mögliche Werte: transformers.
    # Auswirkung: Bestimmt den lokalen Loader.
    backend: transformers

    # model_dir: Lokaler CLIP-Modellordner.
    # Mögliche Werte: Ordner innerhalb von base_dir.
    # Auswirkung: Enthält Config, Processor, Tokenizer und Gewichte.
    model_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/clip

    # local_files_only: Netzwerkzugriff beim Laden blockieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true verhindert unbeabsichtigte Downloads.
    local_files_only: true

    # device: Zielgerät.
    # Mögliche Werte: auto, cpu oder cuda.
    # Auswirkung: auto wählt ein verfügbares lokales Gerät.
    device: auto

# -----------------------------------------------------------------------------
# culling
# Technisches Culling und Routing innerhalb eines Batch-Ordners.
# Referenz- und persönliche Scores bleiben getrennte Komponenten.
# -----------------------------------------------------------------------------
culling:
  # enabled: Technische Culling-Bewertung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: false deaktiviert die Bewertung, nicht die Batchverwaltung.
  enabled: true

  # move_files: Bewertete JPGs in Review oder Rejected verschieben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Jede Verschiebung benötigt vorherige Sicherheitsprüfung.
  move_files: true

  # arw_dirname: Ordner für RAW-Dateien.
  # Mögliche Werte: ARW.
  # Auswirkung: RAW-Dateien bleiben vom JPG-Culling getrennt.
  arw_dirname: ARW

  # save_dirname: Ordner für Sicherungen und Reports.
  # Mögliche Werte: SAVE.
  # Auswirkung: ZIPs und Bewertungsreports werden dort abgelegt.
  save_dirname: SAVE

  # review_dirname: Ziel für manuelle Review-Fälle.
  # Mögliche Werte: Review.
  # Auswirkung: Unsichere Entscheidungen werden nicht verworfen.
  review_dirname: Review

  # rejected_dirname: Ziel für technische Reject-Fälle.
  # Mögliche Werte: Rejected.
  # Auswirkung: Reject bleibt nachvollziehbar und getrennt.
  rejected_dirname: Rejected

  # create_review_folder: Review-Ordner automatisch bereitstellen.
  # Mögliche Werte: true oder false.
  # Auswirkung: Erstellt den Ordner nach erfolgreicher Pfadprüfung.
  create_review_folder: true

  # create_rejected_folder: Rejected-Ordner automatisch bereitstellen.
  # Mögliche Werte: true oder false.
  # Auswirkung: Erstellt den Ordner nach erfolgreicher Pfadprüfung.
  create_rejected_folder: true

  # keep_threshold: Mindestwert für eine Keep-Entscheidung.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Werte ab dieser Grenze können Keep erreichen.
  keep_threshold: 0.65

  # reject_threshold: Höchstwert für eine Reject-Entscheidung.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Werte darunter können Reject erreichen.
  reject_threshold: 0.35

  # base_weights: Nur technische Basis-Komponenten.
  # Mögliche Werte: Nichtnegative Gewichte.
  # Auswirkung: Referenz- und Personenscores werden nicht doppelt eingemischt.
  base_weights:
    sharp: 0.40
    aesth: 0.40
    exposure: 0.20

  # component_weights: Finale Score-Komponenten.
  # Mögliche Werte: Nichtnegative Gewichte.
  # Auswirkung: Nicht verfügbare Werte werden später normalisiert.
  component_weights:
    base_score: 0.55
    eye_score: 0.10
    aesthetic_reference_score: 0.10
    personal_score: 0.10
    family_score: 0.15

  # eye_detection: Optionale Augenprüfung.
  # Mögliche Werte: enabled true oder false.
  # Auswirkung: Fehlende Bibliotheken dürfen nicht als harter Crash enden.
  eye_detection:
    enabled: true

  # star_rating_bands: Schwellen für die Metadatenbewertung.
  # Mögliche Werte: Sterne 0 bis 5 mit Scoregrenzen.
  # Auswirkung: Erstellt reproduzierbare Ratingwerte.
  star_rating_bands:
    5: 0.90
    4: 0.75
    3: 0.60
    2: 0.40
    1: 0.20
    0: 0.00

# -----------------------------------------------------------------------------
# reference_pools
# Gemeinsamer Vertrag für aesthetic, personal und face.
# selection.json bleibt je Pool die alleinige Wahrheit.
# -----------------------------------------------------------------------------
reference_pools:
  # common: Gemeinsame harte Kapazitäts- und Namensregeln.
  common:
    # max_active: Maximale aktive Referenzen je Pool.
    # Mögliche Werte: Positive Ganzzahl.
    # Auswirkung: Weitere Aktivierung wird blockiert.
    max_active: 100

    # min_active: Mindestgröße für einen gültigen aktiven Adapter.
    # Mögliche Werte: 0 bis max_active.
    # Auswirkung: Darunter bleibt der betroffene Score inaktiv.
    min_active: 5

    # target_active: Angestrebte Poolgröße.
    # Mögliche Werte: min_active bis max_active.
    # Auswirkung: Abweichungen werden im Report gemeldet.
    target_active: 30

    # max_new: Maximale offene Vorschläge je Pool.
    # Mögliche Werte: Nichtnegative Ganzzahl.
    # Auswirkung: Volle Queues erzeugen user_actions_required.
    max_new: 20

    # max_new_per_batch: Vorschlagsgrenze je Batch.
    # Mögliche Werte: 0 bis max_new.
    # Auswirkung: Verhindert Vorschlagsfluten aus einem Batch.
    max_new_per_batch: 5

    # rename_active_references: Rename-Pläne für aktive Referenzen erlauben.
    # Mögliche Werte: true oder false.
    # Auswirkung: AP4 darf Pläne erzeugen; AP2 führt nichts aus.
    rename_active_references: true

    # active_filename_template: Deterministisches Namensschema.
    # Mögliche Werte: {rank}, {stem}, {suffix}, {ext}.
    # Auswirkung: Aktive Namen bleiben reproduzierbar.
    active_filename_template: "{rank}__{stem}__{suffix}{ext}"

  # aesthetic_reference: Allgemeine Stilreferenzen.
  aesthetic_reference:
    enabled: true
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/aesthetic_reference
    reference_dirname: reference
    new_dirname: new_refs
    selection_filename: selection.json
    min_quality_score: 0.70
    max_redundancy: 0.90
    preview_size: 32
    cache_enabled: true
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/reference_scoring
    auto_rebuild_on_active_change: true
    force_cache_rebuild: false

  # personal_training: Bewusst aktivierte persönliche Geschmacksreferenzen.
  personal_training:
    enabled: true
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/personal_training
    reference_dirname: reference
    new_dirname: new_refs
    selection_filename: selection.json
    min_quality_score: 0.70
    max_redundancy: 0.90
    cache_enabled: true
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste
    auto_rebuild_on_active_change: true
    force_cache_rebuild: false

  # faces: Personenpools mit case-preserving Ordnernamen.
  faces:
    enabled: true
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/faces
    reference_dirname: reference
    new_dirname: new_faces
    selection_filename: selection.json
    min_quality_score: 0.70
    max_redundancy: 0.95
    crop_size: 256
    min_face_size: 128
    cache_enabled: true
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/family_faces
    auto_rebuild_on_active_change: true
    force_cache_rebuild: false

# -----------------------------------------------------------------------------
# family_recognition
# Schutzregeln, Personenparameter und native Metadaten.
# Personennamen müssen exakt den vorhandenen Ordnernamen entsprechen.
# -----------------------------------------------------------------------------
family_recognition:
  # enabled: Family Recognition aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: AP2 bis AP5 ändern diese Funktion nicht.
  enabled: true

  # protect_detected_family: erkannte Personen vor Reject schützen.
  # Mögliche Werte: true oder false.
  # Auswirkung: Unsichere Fälle werden mindestens Review.
  protect_detected_family: true

  # default_person_weight: Gewicht ohne individuellen Eintrag.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Bestimmt den Familienbeitrag.
  default_person_weight: 0.35

  # person_weights: Case-preserving Namen und individuelle Gewichte.
  # Mögliche Werte: Exakte Ordnernamen unter reference_pools.faces.root_dir.
  # Auswirkung: Namen werden nicht normalisiert oder kleingeschrieben.
  person_weights:
    Chris: 0.35
    Daniel: 0.35
    Kind1: 0.55
    Kind2: 0.55
    Michele: 0.35
    Mutter: 0.35
    Nelly: 0.35
    Oma: 0.30
    Opa: 0.30
    Vater: 0.35

  # match_tolerance: Maximale Face-Distanz.
  # Mögliche Werte: Kalibrierte Fließkommazahl.
  # Auswirkung: Kleinere Werte reduzieren Fehlzuordnungen.
  match_tolerance: 0.45

  # min_reference_images_per_person: Mindestzahl gültiger Referenzen.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Zu kleine Personenpools bleiben inaktiv.
  min_reference_images_per_person: 3

  # max_reference_images_per_person: harte Obergrenze je Person.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Begrenzt Rechenzeit und Poolgröße.
  max_reference_images_per_person: 100

  # write_native_tags: Personen-Tags über ExifTool schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Nur nach erfolgreicher Pfad- und Metadatenprüfung.
  write_native_tags: true

  # write_face_regions: Gesichtsregionen als Metadaten schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Wird nur vom späteren Adapter unterstützt.
  write_face_regions: true

  # exiftool_path: Lokaler ExifTool-Aufruf.
  # Mögliche Werte: PATH-Name oder absoluter Pfad.
  # Auswirkung: Fehlende Tools werden als Status gemeldet.
  exiftool_path: exiftool

# -----------------------------------------------------------------------------
# series_detection
# Reihenfolge: EXIF-Zeit -> Dateinummer -> visuelles Clustering -> Einzelbild.
# -----------------------------------------------------------------------------
series_detection:
  # enabled: Serienerkennung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: AP7 steuert Best-of und Review-Abstufungen.
  enabled: true

  # exif_time_enabled: EXIF-Zeit als primäres Signal verwenden.
  # Mögliche Werte: true oder false.
  # Auswirkung: Zeitnahe Bilder können eine Serie bilden.
  exif_time_enabled: true

  # time_window_seconds: Zeitfenster für EXIF-Serien.
  # Mögliche Werte: Nichtnegative Ganzzahl.
  # Auswirkung: Größere Werte bilden größere Zeitgruppen.
  time_window_seconds: 8

  # filename_sequence_enabled: Dateinummern als zweites Signal verwenden.
  # Mögliche Werte: true oder false.
  # Auswirkung: Sequenzen wie MST06972 bis MST06974 werden erkannt.
  filename_sequence_enabled: true

  # max_filename_gap: Maximaler Nummernsprung.
  # Mögliche Werte: Nichtnegative Ganzzahl.
  # Auswirkung: Begrenzt Dateinummernsequenzen.
  max_filename_gap: 2

  # min_sequence_images: Mindestgröße einer Dateinummernserie.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Einzelbilder bleiben Einzelbilder.
  min_sequence_images: 2

  # visual_clustering_enabled: Visuelles Fallback aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: Nicht zeitlich gruppierte Bilder werden verglichen.
  visual_clustering_enabled: true

  # cluster_eps: Visuelle Distanzschwelle.
  # Mögliche Werte: Fließkommazahl gemäß Adapterkalibrierung.
  # Auswirkung: Kleinere Werte bilden strengere Serien.
  cluster_eps: 0.18

  # min_samples: Mindestzahl visueller Nachbarn.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Verhindert Einzelbild-Serien.
  min_samples: 2

  # preview_size: Größe des visuellen Vergleichsprofils.
  # Mögliche Werte: Positive Ganzzahl in Pixeln.
  # Auswirkung: Steuert Kosten und Reproduzierbarkeit.
  preview_size: 32

  # review_margin: Abstand zur besten Aufnahme für Review.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Nahe Alternativen werden nicht hart verworfen.
  review_margin: 0.03

  # demote_non_best_to: Zielstatus nicht bester Serienbilder.
  # Mögliche Werte: review oder reject nach späterer Freigabe.
  # Auswirkung: Best-of bleibt nachvollziehbar.
  demote_non_best_to: review

# -----------------------------------------------------------------------------
# metadata_culling
# Namespaced Metadaten und Rückprüfung über ExifTool.
# -----------------------------------------------------------------------------
metadata_culling:
  # enabled: Metadatenintegration aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: Keine Bilddatei wird ohne explizite Option verändert.
  enabled: true

  # write_rating: Sternebewertung schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Schreibt XMP-Rating, sofern ExifTool verfügbar ist.
  write_rating: true

  # write_keywords: Namespaced Keywords schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Status und Scores werden nachvollziehbar markiert.
  write_keywords: true

  # write_score_bands: Scorebereiche statt Rohwerte schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Reduziert sensible Detailpersistenz.
  write_score_bands: true

  # write_raw_scores_to_keywords: Rohscores als Keywords schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Nur aktivieren, wenn die Spec dies ausdrücklich verlangt.
  write_raw_scores_to_keywords: false

  # keep_backup: ExifTool-Backupdateien behalten.
  # Mögliche Werte: true oder false.
  # Auswirkung: true verhindert Verlust, erzeugt aber zusätzliche Dateien.
  keep_backup: false

  # exiftool_path: Lokaler ExifTool-Aufruf.
  # Mögliche Werte: PATH-Name oder absoluter Pfad.
  # Auswirkung: Fehlende Tools werden als Status gemeldet.
  exiftool_path: exiftool

  # keyword_schema: Namespaced Keyword-Vertrag.
  # Mögliche Werte: namespaced_v1.
  # Auswirkung: Verhindert uneinheitliche Metadaten.
  keyword_schema: namespaced_v1

# -----------------------------------------------------------------------------
# reporting
# Reports enthalten nur Metadaten, Status, Pfade und Scores.
# Keine Bildbytes, Crops oder Embeddings persistieren.
# -----------------------------------------------------------------------------
reporting:
  # write_json_summary: JSON-Laufsummary schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: Persistiert Status, Hashes und Handlungsbedarf.
  write_json_summary: true

  # write_csv_scores: Scorezeilen als CSV schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: CSV enthält keine Bildbytes oder Embeddings.
  write_csv_scores: true

  # stdout_mode: Ausgabeformat für Scheduler/Administration.
  # Mögliche Werte: scheduler_mail.
  # Auswirkung: Formatiert den Abschlussreport.
  stdout_mode: scheduler_mail

  # require_user_actions_required: Handlungsbedarf explizit melden.
  # Mögliche Werte: true oder false.
  # Auswirkung: Volle Queues und Recovery-Aufgaben werden sichtbar.
  require_user_actions_required: true

# -----------------------------------------------------------------------------
# safety
# Harte Sicherheitsgrenzen für Pfade, Links und Löschaktionen.
# -----------------------------------------------------------------------------
safety:
  # require_paths_within_base_dir: Kanonische Pfadgrenze erzwingen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert Traversal und Außenpfade.
  require_paths_within_base_dir: true

  # follow_symlinks: Symbolischen Links folgen.
  # Mögliche Werte: true oder false.
  # Auswirkung: false verhindert Pfadgrenzen-Umgehung.
  follow_symlinks: false

  # never_delete_outside_arw_dir: Löschschutz außerhalb des ARW-Bereichs.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert unzulässige Löschaktionen.
  never_delete_outside_arw_dir: true# Projekt: Synology Photo Workflow
# Datei: config/config.target-reference-pools.yaml
# Funktion: Strikte Zielkonfiguration für AP2/AP3 und Referenzpoolverwaltung.
# Hinweis: Diese Datei ist erst nach Schema-Integration als aktive Config zulässig.
# Version: 1.0.0
# Änderungsprotokoll:
#   2026-08-09 | 1.0.0 | 98AP-konforme Zielconfig für Runtime und Pools

# -----------------------------------------------------------------------------
# paths
# Dieser Block definiert alle produktiven Datenwurzeln des Workflows.
# Alle Pfade müssen innerhalb von base_dir liegen; publish_root bleibt separat.
# -----------------------------------------------------------------------------
paths:
  # base_dir: Kanonische Sicherheitsgrenze für produktive NAS-Daten.
  # Mögliche Werte: Existierender NAS-Ordner ohne nachgelagerten Dateipfad.
  # Auswirkung: Alle produktiven Unterpfade werden gegen diese Wurzel geprüft.
  base_dir: ../NAS_EXAMPLE

  # temp_error: Quarantäne für unsichere oder fehlerhafte Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Unsichere Batchzustände dürfen hier isoliert werden.
  temp_error: ../NAS_EXAMPLE/00_TEMP_ERROR

  # temp_sd: Eingangsbereich neuer Kamera-Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Phase 1 liest neue Batches ausschließlich aus diesem Bereich.
  temp_sd: ../NAS_EXAMPLE/01_TEMP_SD

  # temp_images: Arbeitsbereich für die Phase-1-Ausgabe.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Nach erfolgreicher Phase 1 liegt der Batch hier zur Sichtung.
  temp_images: ../NAS_EXAMPLE/02_TEMP_IMAGES

  # temp_done: Übergabebereich für manuell freigegebene Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Nur freigegebene Batches dürfen Phase 2 erreichen.
  temp_done: ../NAS_EXAMPLE/03_TEMP_DONE

  # temp_final: Optionaler lokaler Finalisierungsbereich.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Phase 3 kann hier kontrolliert enden, ohne Veröffentlichung.
  temp_final: ../NAS_EXAMPLE/04_TEMP_FINAL

  # manual_keep_inbox: Eingang externer, noch nicht zugeordneter Keeps.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Manual Keep bleibt vom normalen Culling getrennt.
  manual_keep_inbox: ../NAS_EXAMPLE/MANUAL_KEEP/inbox

  # manual_keep_used: Bereits erfolgreich zugeordnete Manual-Keep-Dateien.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Verhindert wiederholte Zuordnung derselben Quelldatei.
  manual_keep_used: ../NAS_EXAMPLE/MANUAL_KEEP/used

  # workflow_data_dir: Wurzel für Logs, Pools, Modelle und Runtimezustände.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Persistente Workflowdaten bleiben vom Batch getrennt.
  workflow_data_dir: ../NAS_EXAMPLE/WORKFLOW_DATA

# -----------------------------------------------------------------------------
# workflow
# Dieser Block steuert Locking, Stabilitätswartezeit und Batch-Übergänge.
# Änderungen beeinflussen Wiederaufnahme und sichere Dateibewegungen.
# -----------------------------------------------------------------------------
workflow:
  # wait_time_seconds: Stabilitätswartezeit für neue Batches.
  # Mögliche Werte: Nichtnegative Ganzzahl in Sekunden.
  # Auswirkung: Der Batch muss während dieser Zeit unverändert bleiben.
  wait_time_seconds: 60

  # stale_lock_seconds: Maximales Alter eines verwaisten Locks.
  # Mögliche Werte: Positive Ganzzahl in Sekunden.
  # Auswirkung: Nur eindeutig veraltete Locks dürfen recoveryfähig sein.
  stale_lock_seconds: 43200

  # merge_strategy: Verhalten bei bereits vorhandenem Zielbatch.
  # Mögliche Werte: merge_then_fallback.
  # Auswirkung: Merge wird zuerst versucht; Kollisionen erhalten Fallbacknamen.
  merge_strategy: merge_then_fallback

  # create_done_marker_before_move: Abschlussmarker vor Batch-Move schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true dokumentiert Abschluss vor dem kontrollierten Verschieben.
  create_done_marker_before_move: true

# -----------------------------------------------------------------------------
# runtime
# Dieser Block bündelt alle veränderlichen Logs, States und Laufberichte.
# Es gibt keinen stillen Fallback auf alte Pfade außerhalb dieses Blocks.
# -----------------------------------------------------------------------------
runtime:
  # lock_file: Globaler Lock für parallele Workflow-Läufe.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Verhindert parallele produktive Mutationen.
  lock_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/locks/.script.lock

  # state_dir: Atomare Zustandsdateien der Batchphasen.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Zustandsübergänge werden dort versioniert abgelegt.
  state_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/state

  # quarantine_dir: Runtime-Quarantäne für fehlerhafte technische Zustände.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Unsichere Artefakte werden isoliert statt still weiterverarbeitet.
  quarantine_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/quarantine

  # log_file: Normales Workflowprotokoll.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Ereignisse werden zentral und konsistent protokolliert.
  log_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/process.log

  # error_log: Fehler- und Blockierungsprotokoll.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Fehler bleiben vom normalen Laufprotokoll getrennt.
  error_log: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/error.log

  # run_summaries_dir: JSON- und CSV-Laufzusammenfassungen.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Reports enthalten Status, Hashes und user_actions_required.
  run_summaries_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/run_summaries

  # calibration_batches_dir: Unveränderliche Kalibrierungsdatensätze.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Menschliche Endentscheidungen bleiben revisionsfähig.
  calibration_batches_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/calibration/batches

# -----------------------------------------------------------------------------
# models
# Dieser Block beschreibt lokale Modellartefakte ohne Geheimnisse oder Tokens.
# Modellgewichte und Caches dürfen nicht in Git persistiert werden.
# -----------------------------------------------------------------------------
models:
  # clip: Lokales CLIP-Grundmodell für den späteren personal_score.
  # Mögliche Werte: transformers mit lokalem Modellordner.
  # Auswirkung: false hält CLIP im Schattenmodus und verändert kein Culling.
  clip:
    # enabled: CLIP-Adapter aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt später die Berechnung von personal_score.
    enabled: false

    # backend: Technischer Modelladapter.
    # Mögliche Werte: transformers.
    # Auswirkung: Bestimmt den Loader für config, Processor und Gewichte.
    backend: transformers

    # model_dir: Vollständiger lokaler CLIP-Modellordner.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/models.
    # Auswirkung: Alle Modell- und Processor-Dateien werden daraus geladen.
    model_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/clip

    # local_files_only: Netzwerkzugriff beim Laden verhindern.
    # Mögliche Werte: true oder false.
    # Auswirkung: true blockiert unbeabsichtigte Downloads.
    local_files_only: true

    # device: Zielgerät für die Modellberechnung.
    # Mögliche Werte: auto, cpu oder cuda.
    # Auswirkung: auto wählt ein verfügbares lokales Gerät.
    device: auto

# -----------------------------------------------------------------------------
# reference_pools
# Dieser Block trennt aktive Referenzen von manuellen Vorschlägen.
# selection.json ist je Pool die einzige Wahrheit; Limits sind harte Grenzen.
# -----------------------------------------------------------------------------
reference_pools:
  # common: Gemeinsame Kapazitäts- und Umbenennungsregeln.
  # Mögliche Werte: Nichtnegative Limits und ein erlaubtes Namensmuster.
  # Auswirkung: Volle Queues lösen Handlungsbedarf aus, löschen aber nichts.
  common:
    # max_active: Maximale Zahl aktiver Referenzen.
    # Mögliche Werte: Positive Ganzzahl.
    # Auswirkung: Weitere Aktivierung wird oberhalb dieses Limits blockiert.
    max_active: 100

    # min_active: Mindestzahl für einen aktiven Adapter.
    # Mögliche Werte: 0 bis max_active.
    # Auswirkung: Unterhalb pausiert nur der betroffene Adapter; Score wird null.
    min_active: 5

    # target_active: Angestrebte Poolgröße.
    # Mögliche Werte: min_active bis max_active.
    # Auswirkung: Der Report meldet Abweichungen vom Zielbereich.
    target_active: 30

    # max_new: Maximale Zahl offener Vorschläge pro Pool.
    # Mögliche Werte: Nichtnegative Ganzzahl.
    # Auswirkung: Bei voller Queue werden keine weiteren Vorschläge gespeichert.
    max_new: 20

    # max_new_per_batch: Maximale Vorschläge aus einem Batch.
    # Mögliche Werte: 0 bis max_new.
    # Auswirkung: Verhindert Vorschlagsfluten aus einem einzelnen Batch.
    max_new_per_batch: 5

    # rename_active_references: Rangbasierte aktive Dateinamen aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt Rename-Pläne nach erfolgreichem Rebuild.
    rename_active_references: true

    # active_filename_template: Deterministisches aktives Dateinamensmuster.
    # Mögliche Werte: {rank}, {stem}, {suffix}, {ext}.
    # Auswirkung: Rang eins erhält den höchsten Poolnutzen.
    active_filename_template: "{rank}__{stem}__{suffix}{ext}"

  # aesthetic_reference: Allgemeiner Stilpool guter, zeitloser Fotos.
  # Mögliche Werte: Poolpfade und Qualitätsgrenzen innerhalb von base_dir.
  # Auswirkung: Liefert später den getrennten aesthetic_reference_score.
  aesthetic_reference:
    # enabled: Allgemeinen Stilpool verwenden.
    # Mögliche Werte: true oder false.
    # Auswirkung: true aktiviert diesen Pool nach erfolgreicher Validierung.
    enabled: true

    # root_dir: Wurzel von reference, new_refs und selection.json.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/samples.
    # Auswirkung: Aktive Stilreferenzen bleiben vom Training getrennt.
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/aesthetic_reference

    # reference_dirname: Ordner aktiver Stilreferenzen.
    # Mögliche Werte: reference.
    # Auswirkung: Nur Dateien hier dürfen aktiv als Stilreferenz dienen.
    reference_dirname: reference

    # new_dirname: Ordner vorgeschlagener Stilreferenzen.
    # Mögliche Werte: new_refs.
    # Auswirkung: Vorschläge werden nie automatisch aktiviert.
    new_dirname: new_refs

    # selection_filename: Pool-Wahrheitsdatei.
    # Mögliche Werte: selection.json.
    # Auswirkung: Dateiliste und Auswahlstatus werden dort geprüft.
    selection_filename: selection.json

    # min_quality_score: Mindestqualität für einen Vorschlag.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Schwächere Kandidaten werden übersprungen.
    min_quality_score: 0.70

    # max_redundancy: Maximale erlaubte Ähnlichkeit zu aktiven Referenzen.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Zu ähnliche Kandidaten werden nicht vorgeschlagen.
    max_redundancy: 0.90

    # cache_dir: RAM-/Profilcache ohne persistente Embeddings.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/models.
    # Auswirkung: Cache wird bei Pooländerung invalidiert und neu aufgebaut.
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/reference_scoring

  # personal_training: Persönlicher Geschmack, getrennt vom allgemeinen Stil.
  # Mögliche Werte: Poolpfade und Qualitätsgrenzen innerhalb von base_dir.
  # Auswirkung: Liefert später ausschließlich personal_score.
  personal_training:
    # enabled: Persönlichen Geschmackspool aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt späteres Training aus aktiven Referenzen.
    enabled: true

    # root_dir: Wurzel des persönlichen Pools.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/samples.
    # Auswirkung: Persönliche Referenzen werden nicht mit Stilreferenzen vermischt.
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/personal_training

    # reference_dirname: Manuell aktive persönliche Referenzen.
    # Mögliche Werte: reference.
    # Auswirkung: Nur diese Dateien dürfen Training oder Scoring beeinflussen.
    reference_dirname: reference

    # new_dirname: Manuelle Prüfqueue persönlicher Vorschläge.
    # Mögliche Werte: new_refs.
    # Auswirkung: Volle Queue meldet user_actions_required statt Löschung.
    new_dirname: new_refs

    # selection_filename: Wahrheit für Status und menschliche Aktivierung.
    # Mögliche Werte: selection.json.
    # Auswirkung: Manuelles Verschieben nach reference löst Rebuild aus.
    selection_filename: selection.json

    # min_quality_score: Mindestqualität für persönliche Kandidaten.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Niedrige Qualität wird nicht vorgeschlagen.
    min_quality_score: 0.70

    # max_redundancy: Maximale Ähnlichkeit zu aktiven persönlichen Referenzen.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Redundante Kandidaten werden übersprungen.
    max_redundancy: 0.90

    # cache_dir: Persönlicher Modell- und Cachebereich.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/models.
    # Auswirkung: Rebuild erfolgt nach aktiver Pooländerung.
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste

  # faces: Wurzel aller case-preserving Personenpools.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/faces.
  # Auswirkung: Namen wie Chris bleiben exakt erhalten.
  faces:
    # enabled: Face-Poolverwaltung aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt bekannte Personenpools nach Validierung.
    enabled: true

    # root_dir: Wurzel der Personenordner.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/faces.
    # Auswirkung: Jeder Unterordner bildet einen eigenen Face-Pool.
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/faces

    # reference_dirname: Aktive Face-Crops.
    # Mögliche Werte: reference.
    # Auswirkung: Nur hier liegende Crops werden fürs Matching aktiviert.
    reference_dirname: reference

    # new_dirname: Vorschlagsqueue für bekannte Personen.
    # Mögliche Werte: new_faces.
    # Auswirkung: Aktivierung erfolgt ausschließlich manuell.
    new_dirname: new_faces

    # selection_filename: Wahrheit je Personenpool.
    # Mögliche Werte: selection.json.
    # Auswirkung: Dateiliste und Poolstatus müssen deckungsgleich sein.
    selection_filename: selection.json

    # min_quality_score: Mindestqualität eines Face-Crop-Vorschlags.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Schlechte Crops werden übersprungen.
    min_quality_score: 0.70

    # max_redundancy: Maximale Ähnlichkeit innerhalb des Face-Pools.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Nahezu identische Crops werden nicht vorgeschlagen.
    max_redundancy: 0.95

    # crop_size: Kantenlänge quadratischer Face-Crops.
    # Mögliche Werte: Positive Ganzzahl in Pixeln.
    # Auswirkung: Vorschläge werden einheitlich gespeichert.
    crop_size: 256

    # min_face_size: Mindestgröße des erkannten Gesichts.
    # Mögliche Werte: Positive Ganzzahl in Pixeln.
    # Auswirkung: Zu kleine Gesichter werden nicht vorgeschlagen.
    min_face_size: 128

    # cache_dir: Flüchtiger Face-Modellcache außerhalb von Reports.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/models.
    # Auswirkung: Embeddings bleiben RAM-/Cachevertragskonform.
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/family_faces

# -----------------------------------------------------------------------------
# safety und reporting
# Dieser Block verhindert unsichere Pfade und macht manuelle Aufgaben sichtbar.
# Keine Einstellung darf stille Löschung oder stilles Überschreiben erlauben.
# -----------------------------------------------------------------------------
safety:
  # require_paths_within_base_dir: Kanonische Pfadgrenze erzwingen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert Traversal, Symlinkumgehung und Außenpfade.
  require_paths_within_base_dir: true

  # follow_symlinks: Symbolischen Links folgen.
  # Mögliche Werte: true oder false.
  # Auswirkung: false verhindert Pfadgrenzen-Umgehung.
  follow_symlinks: false

  # never_delete_outside_arw_dir: Löschschutz außerhalb des ARW-Bereichs.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert unzulässige Löschaktionen.
  never_delete_outside_arw_dir: true

reporting:
  # write_json_summary: JSON-Laufsummary schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true persistiert Status, Fingerprint und Handlungsbedarf.
  write_json_summary: true

  # write_csv_scores: Bewertungszeilen als CSV schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt Scores ohne Bildbytes oder Embeddings.
  write_csv_scores: true

  # require_user_actions_required: Handlungsbedarf explizit melden.
  # Mögliche Werte: true oder false.
  # Auswirkung: true meldet volle Vorschlagsqueues und Recovery-Aufgaben.
  require_user_actions_required: true
