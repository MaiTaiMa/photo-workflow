# Projekt: Synology Photo Workflow
# Datei: config/config.yaml
# Zweck: Zentrale, secrets-freie Konfiguration des Photo Workflow.
# Version: 1.3
# Hinweis: Alle produktiven Pfade müssen innerhalb von paths.base_dir liegen.
#
# Änderungsprotokoll:
#   2026-08-08 | 1.2 | Lokale Face- und Culling-Modelle ergänzt
#   2026-08-08 | 1.3 | Modellordner und Config-Kommentare nach 98AP ergänzt

# -----------------------------------------------------------------------------
# paths
# Dieser Block definiert den erlaubten NAS-Datenbereich und technische Artefakte.
# Alle produktiven Pfade werden vor der Verarbeitung kanonisch geprüft.
# -----------------------------------------------------------------------------
paths:
  # base_dir: Obergrenze für alle produktiven Pfade.
  # Mögliche Werte: Existierender NAS-Datenordner.
  # Auswirkung: Pfade außerhalb dieses Ordners werden blockiert.
  base_dir: ../NAS_EXAMPLE/

  # temp_sd: Eingangsbereich für neue SD-Karten-Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Eingehende Batches werden hier erkannt.
  temp_sd: ../NAS_EXAMPLE/01_TEMP_SD

  # temp_images: Temporärer Arbeitsbereich für Bilddaten.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Temporäre Bildverarbeitung bleibt im erlaubten Datenbereich.
  temp_images: ../NAS_EXAMPLE/02_TEMP_IMAGES

  # temp_done: Zielbereich für erfolgreich abgeschlossene Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Nur erfolgreich abgeschlossene Batches dürfen hier landen.
  temp_done: ../NAS_EXAMPLE/03_TEMP_DONE

  # log_file: Protokolldatei für normale Workflow-Ereignisse.
  # Mögliche Werte: Datei innerhalb von base_dir.
  # Auswirkung: Normale Laufereignisse werden dort persistiert.
  log_file: ../NAS_EXAMPLE/WORKFLOW_DATA/process.log

  # error_log: Protokolldatei für Fehler und blockierende Zustände.
  # Mögliche Werte: Datei innerhalb von base_dir.
  # Auswirkung: Fehler werden getrennt vom normalen Laufprotokoll gespeichert.
  error_log: ../NAS_EXAMPLE/WORKFLOW_DATA/error.log

  # lock_file: Globaler Lock für produktive Workflow-Läufe.
  # Mögliche Werte: Datei innerhalb von base_dir.
  # Auswirkung: Parallele produktive Läufe werden verhindert.
  lock_file: ../NAS_EXAMPLE/WORKFLOW_DATA/.script.lock

  # personal_model: Persönliches Bewertungsmodell.
  # Mögliche Werte: JSON-Datei innerhalb von base_dir/models/taste.
  # Auswirkung: Persönliche Bewertungsdaten bleiben im Modellbereich.
  personal_model: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste/user_taste_model.json

# -----------------------------------------------------------------------------
# workflow
# Dieser Block steuert Wartezeiten, Locks, Merge-Verhalten und Datumslogik.
# Änderungen können den Batch-Lebenszyklus und die Wiederaufnahme beeinflussen.
# -----------------------------------------------------------------------------
workflow:
  # wait_time_seconds: Wartezeit zur Stabilitätsprüfung eines neuen Batches.
  # Mögliche Werte: Nichtnegative Ganzzahl in Sekunden.
  # Auswirkung: Der Batch muss während dieser Zeit unverändert bleiben.
  wait_time_seconds: 60

  # stale_lock_seconds: Maximales Alter eines Locks vor der Veraltung.
  # Mögliche Werte: Positive Ganzzahl in Sekunden.
  # Auswirkung: Alte Locks dürfen nach Prüfung behandelt werden.
  stale_lock_seconds: 43200

  # merge_strategy: Strategie zum Zusammenführen vorhandener Zustände.
  # Mögliche Werte: merge_then_fallback.
  # Auswirkung: Zuerst wird ein Merge versucht, danach der Fallback.
  merge_strategy: merge_then_fallback

  # create_done_marker_before_move: Abschlussmarker vor dem Verschieben erzeugen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true dokumentiert den Abschluss vor dem Datei-Move.
  create_done_marker_before_move: true

  # date_reconstruction: Rekonstruktion fehlender Aufnahmedaten.
  # Mögliche Werte: Vertragskonforme Rekonstruktionsparameter.
  # Auswirkung: Bestimmt die Ableitung fehlender Datumsinformationen.
  date_reconstruction:
    # mode: Historisch kompatibler Rekonstruktionsmodus.
    # Mögliche Werte: legacy_bash.
    # Auswirkung: Verwendet die bisherige Bash-kompatible Logik.
    mode: legacy_bash

    # decade_prefix: Präfix für rekonstruierte Jahreswerte.
    # Mögliche Werte: Zeichenkette gemäß Workflow-Vertrag.
    # Auswirkung: Wird dem rekonstruierten Jahreswert vorangestellt.
    decade_prefix: "202"

    # year_digit_index: Position der relevanten Jahresziffer.
    # Mögliche Werte: Nichtnegative Ganzzahl.
    # Auswirkung: Bestimmt die verwendete Quellposition.
    year_digit_index: 3

# -----------------------------------------------------------------------------
# models
# Dieser Block definiert alle lokalen KI-Modelle des Workflows.
# Alle Modell- und Begleitdateien liegen unter WORKFLOW_DATA/models.
# -----------------------------------------------------------------------------
models:
  # face_detection: Lokale YuNet-Gesichtserkennung.
  # Mögliche Werte: OpenCV-ONNX-Modell.
  # Auswirkung: Liefert Gesichtsboxen und fünf Gesichtspunkte.
  face_detection:
    # backend: Technischer Loader für das Modell.
    # Mögliche Werte: opencv.
    # Auswirkung: Lädt das ONNX-Modell über OpenCV.
    backend: opencv

    # model_path: Pfad zum YuNet-ONNX-Modell.
    # Mögliche Werte: Datei innerhalb von paths.base_dir.
    # Auswirkung: Wird für die Gesichtserkennung geladen.
    model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/face/face_detection_yunet_2023mar.onnx

    # confidence_threshold: Mindestvertrauen für einen Gesichtstreffer.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Werte ab 0.65 werden als Detection-Kandidaten akzeptiert.
    confidence_threshold: 0.65

    # max_input_side: Maximale Bildseitenlänge für die Analyse.
    # Mögliche Werte: Positive Ganzzahl in Pixeln.
    # Auswirkung: Größere Bilder werden vor der Erkennung proportional skaliert.
    max_input_side: 1600

    # nms_threshold: Schwelle für Non-Maximum-Suppression.
    # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
    # Auswirkung: Reduziert doppelte, überlappende Gesichtstreffer.
    nms_threshold: 0.3

    # top_k: Maximale Zahl der Kandidaten vor der Auswahl.
    # Mögliche Werte: Positive Ganzzahl.
    # Auswirkung: Begrenzt Rechenzeit und Speicherverbrauch.
    top_k: 5000

  # face_recognition: Lokale SFace-Gesichtserkennung.
  # Mögliche Werte: OpenCV-ONNX-Modell.
  # Auswirkung: Erzeugt Embeddings für den Personenvergleich.
  face_recognition:
    # backend: Technischer Loader für das Modell.
    # Mögliche Werte: opencv.
    # Auswirkung: Lädt das SFace-ONNX-Modell über OpenCV.
    backend: opencv

    # model_path: Pfad zum SFace-ONNX-Modell.
    # Mögliche Werte: Datei innerhalb von paths.base_dir.
    # Auswirkung: Erzeugt Embeddings aus ausgerichteten Gesichtern.
    model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/face/face_recognition_sface_2021dec.onnx

    # distance_metric: Metrik für Embedding-Vergleiche.
    # Mögliche Werte: cosine oder l2.
    # Auswirkung: Bestimmt die Ähnlichkeit zwischen Referenz und Gesicht.
    distance_metric: cosine

    # match_tolerance: Maximale akzeptierte Vergleichsdistanz.
    # Mögliche Werte: Fließkommazahl gemäß Adapter-Kalibrierung.
    # Auswirkung: Kleinere Werte reduzieren Fehlzuordnungen.
    match_tolerance: 0.6

  # culling: Lokales Modell für generische Bildbewertung.
  # Mögliche Werte: Adapter passend zur tatsächlichen Modellarchitektur.
  # Auswirkung: Liefert Scores, führt aber keine Dateioperationen aus.
  culling:
    # backend: Technischer Loader für das Culling-Modell.
    # Mögliche Werte: transformers, torch oder projektspezifischer Adapter.
    # Auswirkung: Muss zur Architektur von model.safetensors passen.
    backend: transformers

    # model_path: Gewichtsdatei oder vollständiger Modellpfad.
    # Mögliche Werte: Datei innerhalb von paths.base_dir.
    # Auswirkung: Lädt die lokalen Culling-Gewichte.
    model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/clip/model.safetensors

    # model_config_path: Architekturdefinition des Culling-Modells.
    # Mögliche Werte: Vorhandene config.json im Modellordner.
    # Auswirkung: Ohne passende Architektur darf das Modell nicht geladen werden.
    model_config_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/clip/config.json

    # processor_config_path: Bildvorverarbeitung des Culling-Modells.
    # Mögliche Werte: Vorhandene preprocessor_config.json.
    # Auswirkung: Definiert Bildgröße, Normalisierung und Eingabeformat.
    processor_config_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/clip/preprocessor_config.json

# -----------------------------------------------------------------------------
# culling
# Dieser Block steuert Scores, Schwellenwerte und Review-Verschiebungen.
# Original-JPGs und ARWs dürfen niemals still überschrieben oder gelöscht werden.
# -----------------------------------------------------------------------------
culling:
  # enabled: Aktiviert die Culling-Bewertung.
  # Mögliche Werte: true oder false.
  # Auswirkung: true berechnet Culling-Entscheidungen.
  enabled: true

  # move_files: Erlaubt Datei-Moves nach erfolgreicher Gate-Prüfung.
  # Mögliche Werte: true oder false.
  # Auswirkung: true erlaubt Moves innerhalb der Vertragslogik.
  move_files: true

  # create_review_folder: Review-Ordner automatisch anlegen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true stellt den Review-Zielordner bereit.
  create_review_folder: true

  # create_rejected_folder: Rejected-Ordner automatisch anlegen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true stellt den Rejected-Zielordner bereit.
  create_rejected_folder: true

  # keep_threshold: Mindestscore für eine Keep-Entscheidung.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Scores ab diesem Wert können Keep erreichen.
  keep_threshold: 0.65

  # reject_threshold: Höchstscore für eine Reject-Entscheidung.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Scores unter diesem Wert können Reject erreichen.
  reject_threshold: 0.35

  # weights: Gewichte der generischen und persönlichen Bewertung.
  # Mögliche Werte: Nichtnegative Fließkommazahlen.
  # Auswirkung: Bestimmt den Einfluss beider Bewertungskomponenten.
  weights:
    # generic: Anteil der generischen Bewertung.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Erhöht den Einfluss des allgemeinen Bildscores.
    generic: 0.55

    # personal: Anteil der persönlichen Bewertung.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Erhöht den Einfluss des persönlichen Geschmacksmodells.
    personal: 0.45

  # component_weights: Gewichte der einzelnen Score-Komponenten.
  # Mögliche Werte: Nichtnegative Fließkommazahlen.
  # Auswirkung: Bestimmt die Zusammensetzung des Gesamtwerts.
  component_weights:
    # base_score: Anteil des generischen Basisscores.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet Schärfe, Ästhetik, Belichtung und Referenz.
    base_score: 0.55

    # eye_score: Anteil der Augenprüfung.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet offene und problemfreie Augen.
    eye_score: 0.1

    # personal_score: Anteil des persönlichen Scores.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet das persönliche Bewertungsmodell.
    personal_score: 0.2

    # family_score: Anteil der Familienerkennung.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet erkannte geschützte Personen.
    family_score: 0.15

  # base_weights: Gewichte des generischen Basisscores.
  # Mögliche Werte: Nichtnegative Fließkommazahlen.
  # Auswirkung: Kombiniert die vier generischen Bildmerkmale.
  base_weights:
    # sharp: Anteil der Schärfebewertung.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet technische Bildschärfe.
    sharp: 0.36

    # aesth: Anteil der ästhetischen Bewertung.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet die allgemeine Bildästhetik.
    aesth: 0.36

    # exposure: Anteil der Belichtungsbewertung.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet die technische Belichtung.
    exposure: 0.18

    # reference: Anteil des Referenzscores.
    # Mögliche Werte: Nichtnegative Fließkommazahl.
    # Auswirkung: Gewichtet die Nähe zu Referenzbildern.
    reference: 0.1

  # eye_detection: Aktiviert die Augenprüfung.
  # Mögliche Werte: true oder false.
  # Auswirkung: true berücksichtigt geschlossene oder problematische Augen.
  eye_detection:
    enabled: true

  # reference_scoring: Vergleich mit generischen Referenzbildern.
  # Mögliche Werte: Vertragskonforme Referenzparameter.
  # Auswirkung: Referenzbilder beeinflussen den generischen Basisscore.
  reference_scoring:
    # enabled: Referenzbewertung aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true berechnet Referenzähnlichkeiten.
    enabled: true

    # folder: Ordner mit Referenzbildern.
    # Mögliche Werte: Ordner innerhalb von paths.base_dir.
    # Auswirkung: Bilder aus diesem Ordner werden als Referenz verwendet.
    folder: ../NAS_EXAMPLE/WORKFLOW_DATA/samples

    # recursive: Unterordner rekursiv durchsuchen.
    # Mögliche Werte: true oder false.
    # Auswirkung: true berücksichtigt verschachtelte Referenzordner.
    recursive: false

    # preview_size: Größe der Vorschaubilder.
    # Mögliche Werte: Positive Ganzzahl gemäß Adapter.
    # Auswirkung: Begrenzt den Aufwand der Referenzbewertung.
    preview_size: 32

    # cache_enabled: Referenzcache aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true darf gültige Referenzergebnisse wiederverwenden.
    cache_enabled: true

    # cache_dir: Speicherort des Referenzbewertungscaches.
    # Mögliche Werte: Ordner innerhalb von paths.base_dir/models.
    # Auswirkung: Trennt den Cache vom persönlichen Bewertungsmodell.
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/reference_scoring

    # force_cache_rebuild: Referenzcache vollständig neu erstellen.
    # Mögliche Werte: true oder false.
    # Auswirkung: true verwirft den bisherigen Cache nach Sicherheitsprüfung.
    force_cache_rebuild: false

  # star_rating_bands: Zuordnung von Scores zu Sternebewertungen.
  # Mögliche Werte: Ganzzahlige Sterne mit Grenzen von 0.0 bis 1.0.
  # Auswirkung: Übersetzt Scores in Metadatenbewertungen.
  star_rating_bands:
    5: 0.9
    4: 0.75
    3: 0.6
    2: 0.4
    1: 0.2
    0: 0.0

# -----------------------------------------------------------------------------
# training
# Dieser Block definiert Referenzbilder, Labels und Trainingsartefakte.
# Alle Trainingsdaten und Ergebnisse bleiben innerhalb von WORKFLOW_DATA.
# -----------------------------------------------------------------------------
training:
  # sample_images_dir: Referenzbilder für Training und Bewertung.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir.
  # Auswirkung: Bilder aus diesem Ordner können als Trainingsdaten dienen.
  sample_images_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/reference

  # exported_labels_dir: Exportierte Trainingslabels.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir.
  # Auswirkung: Labels werden dort revisionsfähig gespeichert.
  exported_labels_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/training/exported_labels

  # runs_dir: Trainingsläufe und deren Ergebnisse.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir.
  # Auswirkung: Trainingsartefakte bleiben im NAS-Datenbereich.
  runs_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/training/runs

  # min_labeled_images: Mindestzahl gelabelter Bilder.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Unterhalb dieser Zahl darf kein Training starten.
  min_labeled_images: 20

# -----------------------------------------------------------------------------
# safety
# Dieser Block definiert harte Sicherheitsgrenzen für Pfade und Löschvorgänge.
# Sicherheit hat Vorrang vor Stabilität, Nutzen, Einfachheit und Performance.
# -----------------------------------------------------------------------------
safety:
  # require_paths_within_base_dir: Pfadprüfung erzwingen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert Pfade außerhalb von paths.base_dir.
  require_paths_within_base_dir: true

  # follow_symlinks: Symlinks bei produktiven Pfaden folgen.
  # Mögliche Werte: true oder false.
  # Auswirkung: false verhindert Umgehungen der Pfadgrenzen.
  follow_symlinks: false

  # never_delete_outside_arw_dir: Löschung außerhalb von ARW verhindern.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert jede Löschung außerhalb des erlaubten ARW-Bereichs.
  never_delete_outside_arw_dir: true

# -----------------------------------------------------------------------------
# reporting
# Dieser Block steuert JSON-Zusammenfassungen und Scheduler-Ausgaben.
# Bildbytes, Embeddings, Secrets und Tokens dürfen nicht persistiert werden.
# -----------------------------------------------------------------------------
reporting:
  # write_json_summary: JSON-Laufzusammenfassung schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true erzeugt ein nicht-binäres Laufartefakt.
  write_json_summary: true

  # json_summary_dir: Ordner für Laufzusammenfassungen.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir.
  # Auswirkung: Zusammenfassungen bleiben im erlaubten Datenbereich.
  json_summary_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/run_summaries

  # stdout_mode: Ziel und Format der Standardausgabe.
  # Mögliche Werte: scheduler_mail.
  # Auswirkung: Meldungen werden für Scheduler-Mailaufbereitung ausgegeben.
  stdout_mode: scheduler_mail

# -----------------------------------------------------------------------------
# family_recognition
# Dieser Block steuert Familienreferenzen, Schutzentscheidungen und Face-Caches.
# Automatisch erzeugte Face-Crops werden nicht automatisch als Referenzen aktiviert.
# -----------------------------------------------------------------------------
family_recognition:
  # enabled: Familienerkennung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true aktiviert Erkennung und Familien-Schutzlogik.
  enabled: true

  # reference_dir: Manuell aktivierte Familienreferenzen.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir.
  # Auswirkung: Referenzbilder werden für den Personenvergleich verwendet.
  reference_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/faces

  # protect_detected_family: Erkannte Familienbilder schützen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true verhindert automatische Reject-Entscheidungen für Treffer.
  protect_detected_family: true

  # score_boost_weight: Zusatzgewicht für erkannte Familienpersonen.
  # Mögliche Werte: Fließkommazahl gemäß Scoring-Vertrag.
  # Auswirkung: Erhöht den Familienanteil am Gesamtwert.
  score_boost_weight: 0.2

  # write_native_tags: Native Familien-Tags schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt namespaced Familienmetadaten nach Gate-Prüfung.
  write_native_tags: true

  # write_face_regions: erkannte Gesichtsbereiche schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt erlaubte Gesichtsregion-Metadaten.
  write_face_regions: true

  # exiftool_path: Ausführbares ExifTool.
  # Mögliche Werte: PATH-Auflösung oder absoluter Pfad.
  # Auswirkung: Wird für kontrollierte Metadatenänderungen verwendet.
  exiftool_path: exiftool

  # match_tolerance: Maximale Distanz für Personenmatches.
  # Mögliche Werte: Fließkommazahl gemäß SFace-Kalibrierung.
  # Auswirkung: Kleinere Werte reduzieren Fehlmatches.
  match_tolerance: 0.45

  # default_person_weight: Standardgewicht unbekannter Referenzpersonen.
  # Mögliche Werte: Nichtnegative Fließkommazahl.
  # Auswirkung: Wird verwendet, wenn kein Personengewicht definiert ist.
  default_person_weight: 0.35

  # max_reference_images_per_person: Maximale Referenzbilder je Person.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Begrenzt Speicher- und Rechenaufwand.
  max_reference_images_per_person: 200

  # person_weights: Individuelle Gewichte der bekannten Personen.
  # Mögliche Werte: Nichtnegative Fließkommazahlen.
  # Auswirkung: Überschreibt default_person_weight je Person.
  person_weights:
    Vater: 0.35
    Mutter: 0.35
    Kind1: 0.55
    Kind2: 0.55
    Oma: 0.3
    Opa: 0.3

  # cache_enabled: Familiencache aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true darf gültige Embedding-Ergebnisse im Laufcache verwenden.
  cache_enabled: true

  # cache_dir: Familiencache unterhalb von models.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir/models.
  # Auswirkung: Trennt Familiencache und persönliche Bewertungsdaten.
  cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/family_faces

  # cache_rebuild_mode: Strategie zum Neuaufbau des Familiencaches.
  # Mögliche Werte: incremental.
  # Auswirkung: Nur geänderte Referenzen werden neu verarbeitet.
  cache_rebuild_mode: incremental

  # force_cache_rebuild: Familiencache vollständig neu erstellen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true verwirft den bisherigen Cache nach Sicherheitsprüfung.
  force_cache_rebuild: false

  # min_reference_images_per_person: Mindestzahl je Person.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Unterhalb dieser Zahl wird die Person nicht sicher aktiviert.
  min_reference_images_per_person: 3

# -----------------------------------------------------------------------------
# series_detection
# Dieser Block erkennt Serien und markiert Nicht-Bestbilder für Review.
# Serienentscheidungen dürfen keine ungesicherten ARW-Aktionen auslösen.
# -----------------------------------------------------------------------------
series_detection:
  # enabled: Serienerkennung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true gruppiert ähnliche Bilder zu Serien.
  enabled: true

  # cluster_eps: Maximale Distanz innerhalb eines Clusters.
  # Mögliche Werte: Fließkommazahl gemäß Clustering-Adapter.
  # Auswirkung: Kleinere Werte bilden strengere Serien.
  cluster_eps: 0.18

  # min_samples: Mindestzahl Bilder je Cluster.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Einzelbilder werden nicht als Serie behandelt.
  min_samples: 2

  # preview_size: Größe der Vorschaubilder.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Begrenzt Speicher- und Rechenaufwand.
  preview_size: 32

  # review_margin: Mindestabstand für eine sichere Bestentscheidung.
  # Mögliche Werte: Nichtnegative Fließkommazahl.
  # Auswirkung: Kleine Abstände führen zur manuellen Review.
  review_margin: 0.03

  # demote_non_best_to: Zielstatus für Nicht-Bestbilder.
  # Mögliche Werte: review.
  # Auswirkung: Nicht-Bestbilder werden nicht automatisch gelöscht.
  demote_non_best_to: review

# -----------------------------------------------------------------------------
# metadata_culling
# Dieser Block steuert namespaced Metadaten und deren Rückprüfung.
# ExifTool muss ohne Shell-Interpolation und mit shell=False verwendet werden.
# -----------------------------------------------------------------------------
metadata_culling:
  # enabled: Metadaten-Culling aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt freigegebene Workflow-Metadaten.
  enabled: true

  # write_rating: Sternebewertung schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt die validierte Bewertungsstufe.
  write_rating: true

  # write_keywords: Workflow-Schlüsselwörter schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt namespaced Keywords.
  write_keywords: true

  # keep_backup: Backup vor Metadatenänderung behalten.
  # Mögliche Werte: true oder false.
  # Auswirkung: true bewahrt ein Backup gemäß Metadatenvertrag.
  keep_backup: false

  # exiftool_path: Ausführbares ExifTool.
  # Mögliche Werte: PATH-Auflösung oder absoluter Pfad.
  # Auswirkung: Wird für kontrollierte Metadatenänderungen verwendet.
  exiftool_path: exiftool

  # keyword_schema: Namespaceschema für Workflow-Schlüsselwörter.
  # Mögliche Werte: namespaced_v1.
  # Auswirkung: Verhindert Kollisionen mit fremden Metadaten.
  keyword_schema: namespaced_v1

  # write_score_bands: Score-Bänder als Metadaten schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true persistiert die validierte Bewertungsstufe.
  write_score_bands: true

  # write_raw_scores_to_keywords: Rohscores als Keywords schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt nur vertragskonforme Scorewerte.
  write_raw_scores_to_keywords: true

# -----------------------------------------------------------------------------
# personal_scoring
# Dieser Block steuert das persönliche Bewertungsmodell und dessen Cache.
# Persönliche Referenzen, Embeddings und Modellartefakte bleiben unter models.
# -----------------------------------------------------------------------------
personal_scoring:
  # source_dir: Persönliche Referenzbilder.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir.
  # Auswirkung: Bilder aus diesem Ordner beeinflussen den persönlichen Score.
  source_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/reference

  # model_path: Persönliches Bewertungsmodell.
  # Mögliche Werte: JSON-Datei innerhalb von paths.base_dir/models/taste.
  # Auswirkung: Wird für persönliche Bewertung und Training verwendet.
  model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste/user_taste_model.json

  # cache_dir: Cache des persönlichen Bewertungsmodells.
  # Mögliche Werte: Ordner innerhalb von paths.base_dir/models/taste.
  # Auswirkung: Trennt den persönlichen Cache vom Modell selbst.
  cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste/cache

  # enabled: Persönliche Bewertung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true berücksichtigt den persönlichen Bewertungsanteil.
  enabled: true

  # cache_enabled: Persönlichen Cache aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true darf gültige Ergebnisse wiederverwenden.
  cache_enabled: true

  # cache_rebuild_mode: Strategie zum Neuaufbau des persönlichen Caches.
  # Mögliche Werte: incremental.
  # Auswirkung: Nur geänderte Referenzdaten werden neu verarbeitet.
  cache_rebuild_mode: incremental

  # auto_train_on_change: Training bei Referenzänderung starten.
  # Mögliche Werte: true oder false.
  # Auswirkung: true startet Training nach erfolgreicher Änderungsprüfung.
  auto_train_on_change: true

  # recursive: Persönliche Referenzunterordner durchsuchen.
  # Mögliche Werte: true oder false.
  # Auswirkung: false berücksichtigt nur den direkten Referenzordner.
  recursive: false

  # min_reference_images: Mindestzahl persönlicher Referenzbilder.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Unterhalb dieser Zahl wird kein persönliches Modell trainiert.
  min_reference_images: 5
