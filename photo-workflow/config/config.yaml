# =============================================================================
# Projekt: Synology Photo Workflow
# Datei: config/config.yaml
# Funktion: Zentrale, secrets-freie Betriebs-Konfiguration für AP2 bis AP8.
# Hinweis: Pfade bilden die NAS_EXAMPLE-Struktur ab; Credentials gehören nur in
#          Umgebungsvariablen und niemals in diese Datei.
# Version: 2.1.0
# =============================================================================
# Änderungsprotokoll:
#   2026-08-09 | 2.1.0 | NAS_EXAMPLE-Struktur, Pool-Pfade und Cache-Rebuild ergänzt
#   2026-08-09 | 2.0.0 | Strikte 98AP-Konfiguration für AP2 bis AP8
# =============================================================================

# -----------------------------------------------------------------------------
# paths
# Kanonische Wurzeln für produktive Daten und Legacy-Kompatibilität.
# Alle produktiven Pfade MÜSSEN innerhalb von base_dir liegen.
# -----------------------------------------------------------------------------
paths:
  # base_dir: Obergrenze aller produktiven Workflow-Daten.
  # Mögliche Werte: Existierender NAS-Datenordner.
  # Auswirkung: Pfade außerhalb dieser Grenze werden sicherheitsbedingt blockiert.
  base_dir: ../NAS_EXAMPLE

  # temp_error: Quarantäne für fehlerhafte oder unsichere Batch-Zustände.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Fehler-Batches werden isoliert; keine Folgeaktion wird ausgeführt.
  temp_error: ../NAS_EXAMPLE/00_TEMP_ERROR

  # temp_sd: Eingangsbereich für neue Kamera- oder SD-Karten-Batches.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Phase 1 liest ausschließlich aus diesem Verzeichnis.
  temp_sd: ../NAS_EXAMPLE/01_TEMP_SD

  # temp_images: Arbeitsbereich nach erfolgreicher Eingangsprüfung.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Verarbeitete Batches werden von temp_sd hierher überführt.
  temp_images: ../NAS_EXAMPLE/02_TEMP_IMAGES

  # temp_done: Manuell freigegebener Übergabebereich.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Nur freigegebene Batches dürfen die nächste Phase erreichen.
  temp_done: ../NAS_EXAMPLE/03_TEMP_DONE

  # temp_final: Optionaler Bereich für lokale Endprüfung.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: true/false gibt es hier nicht; ein gesetzter Pfad aktiviert nur den Zielort.
  temp_final: ../NAS_EXAMPLE/04_TEMP_FINAL

  # manual_keep_inbox: Eingang für manuell geschützte Bilder.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Dateien hier erzwingen später eine Keep-Entscheidung.
  manual_keep_inbox: ../NAS_EXAMPLE/MANUAL_KEEP/inbox

  # manual_keep_used: Bereits idempotent zugeordnete Manual-Keep-Quellen.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Verhindert eine zweite Zuordnung derselben Quelle.
  manual_keep_used: ../NAS_EXAMPLE/MANUAL_KEEP/used

  # workflow_data_dir: Wurzel für Modelle, Referenzpools, Runtime und Reports.
  # Mögliche Werte: Unterordner innerhalb von base_dir.
  # Auswirkung: Technische Daten bleiben von Batch-Dateien getrennt.
  workflow_data_dir: ../NAS_EXAMPLE/WORKFLOW_DATA

  # personal_model: Legacy-Kompatibilität für app/photo_workflow.py.
  # Mögliche Werte: JSON-Datei innerhalb von workflow_data_dir/models/taste.
  # Auswirkung: Der aktuelle CLI-Entry-Point legt den Elternordner dieses Pfads an.
  personal_model: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste/user_taste_model.json

  # lock_file: Legacy-Kompatibilität für app/photo_workflow.py.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/locks.
  # Auswirkung: Verhindert parallele produktive CLI-Läufe.
  lock_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/locks/.script.lock

  # log_file: Legacy-Kompatibilität für app/photo_workflow.py.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Der aktuelle CLI-Entry-Point schreibt normale Laufereignisse hierhin.
  log_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/process.log

  # error_log: Legacy-Kompatibilität für app/photo_workflow.py.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Der aktuelle CLI-Entry-Point schreibt Fehler und Blockierungen hierhin.
  error_log: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/error.log

# -----------------------------------------------------------------------------
# runtime
# Strikter AP2-Vertrag für veränderliche Laufzeit-Artefakte.
# Die Duplikate zu paths.* existieren vorübergehend für den bestehenden CLI-Entry-Point.
# -----------------------------------------------------------------------------
runtime:
  # lock_file: Globaler Lock für produktive Runs.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/locks.
  # Auswirkung: Ein vorhandener gültiger Lock blockiert einen parallelen Run.
  lock_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/locks/.script.lock

  # state_dir: Atomare Batch-Zustandsdateien.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Ermöglicht Resume und Recovery mit Hash-Kette.
  state_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/state

  # quarantine_dir: Technische Quarantäne für unsichere Artefakte.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: Quarantänedaten werden nicht weiterverarbeitet.
  quarantine_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/quarantine

  # log_file: Laufprotokoll.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Protokolliert normale Ereignisse.
  log_file: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/process.log

  # error_log: Fehlerprotokoll.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/runtime/logs.
  # Auswirkung: Protokolliert Fehler getrennt vom normalen Lauf.
  error_log: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/logs/error.log

  # run_summaries_dir: Nicht-binäre Laufzusammenfassungen.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: JSON- und CSV-Reports werden hier abgelegt.
  run_summaries_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/run_summaries

  # calibration_batches_dir: Revisionsfähige Kalibrierungsentscheidungen.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime/calibration.
  # Auswirkung: Menschliche Entscheidungen bleiben nachvollziehbar.
  calibration_batches_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/calibration/batches

# -----------------------------------------------------------------------------
# safety
# Harte Schutzgrenzen. Für einen Betriebsstart nur die sicheren Defaultwerte nutzen.
# -----------------------------------------------------------------------------
safety:
  # require_paths_within_base_dir: Kanonische base_dir-Grenze erzwingen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert Traversal und Außenpfade; false deaktiviert diesen Schutz.
  require_paths_within_base_dir: true

  # follow_symlinks: Symlinks bei produktiven Pfaden verfolgen.
  # Mögliche Werte: true oder false.
  # Auswirkung: false blockiert Symlink-Umgehungen; true darf nur kontrolliert verwendet werden.
  follow_symlinks: false

  # never_delete_outside_arw_dir: Löschschutz außerhalb eines ARW-Bereichs.
  # Mögliche Werte: true oder false.
  # Auswirkung: true blockiert unzulässige Löschoperationen; false ist nicht produktiv empfohlen.
  never_delete_outside_arw_dir: true

# -----------------------------------------------------------------------------
# pipeline
# Definiert welche Phasen in welchem Modus ausgeführt werden sollen.
# -----------------------------------------------------------------------------
pipeline:
  # phases: Liste der auszuführenden Phasen (in Reihenfolge)
  # Mögliche Werte: phase1, phase2, phase3, train-personal, rebuild-family-cache
  # Auswirkung: Beim Start mit 'pipeline' werden alle Phasen nacheinander ausgeführt.
  phases:
    - phase1
    - phase2
  
  # stop_on_error: Bei Fehler in einer Phase abbrechen?
  # Mögliche Werte: true oder false.
  # Auswirkung: true stoppt die Pipeline beim ersten Fehler; false führt alle Phasen aus.
  stop_on_error: true
  
  # default: Standard-Pipeline für 'phase12' (alias für pipeline)
  # Mögliche Werte: true oder false.
  # Auswirkung: true macht 'phase12' zum Alias für 'pipeline'.
  default: true

# -----------------------------------------------------------------------------
# workflow
# Steuerung von Batch-Lebenszyklus und Recovery.
# -----------------------------------------------------------------------------
workflow:
  # wait_time_seconds: Stabilitätswartezeit eines neu gefundenen Batches.
  # Mögliche Werte: Nichtnegative Ganzzahl in Sekunden.
  # Auswirkung: Ein Batch muss während dieses Zeitraums unverändert bleiben.
  wait_time_seconds: 60

  # stale_lock_seconds: Alter, ab dem ein Lock als verwaist geprüft werden darf.
  # Mögliche Werte: Positive Ganzzahl in Sekunden.
  # Auswirkung: Ein jüngerer Lock blockiert; ein älterer erfordert Recovery-Prüfung.
  stale_lock_seconds: 43200

  # merge_strategy: Verhalten bei bereits vorhandenem Zielbatch.
  # Mögliche Werte: merge_then_fallback.
  # Auswirkung: Zuerst wird sicher gemerged, Kollisionen erhalten einen neuen Zielnamen.
  merge_strategy: merge_then_fallback

  # create_done_marker_before_move: Abschlussmarker vor dem Batch-Move schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true dokumentiert Abschluss vor dem Übergang; false reduziert Recovery-Sicherheit.
  create_done_marker_before_move: true

  # batch_order: Reihenfolge für neue, noch nicht begonnene Batches.
  # Mögliche Werte: oldest_first oder newest_first.
  # Auswirkung: Resume-Kandidaten haben immer Vorrang; diese Einstellung
  #              betrifft nur neue Batches in 01_TEMP_SD.
  batch_order: oldest_first

  # max_batches_per_run: Begrenzung vollständig neu begonnener Batches je Run.
  # Mögliche Werte: null oder positive Ganzzahl.
  # Auswirkung: null verarbeitet unbegrenzt; eine positive Zahl begrenzt neue
  #              Batches. 0 ist ungültig und blockiert die Config.
  max_batches_per_run: null

  # max_images_per_run: Planungsgrenze für Bilder aller neuen Batches je Run.
  # Mögliche Werte: null oder positive Ganzzahl.
  # Auswirkung: null ist unbegrenzt; ein zu großer Batch wird vollständig
  #              zurückgestellt und nie teilweise als fertig markiert.
  max_images_per_run: null

  # max_images_per_batch: Maximale Bildzahl einer internen geplanten WorkUnit.
  # Mögliche Werte: null oder positive Ganzzahl.
  # Auswirkung: null plant den gesamten Batch als eine WorkUnit; eine positive
  #              Zahl teilt große Batches für die spätere Resume-Ausführung.
  max_images_per_batch: null

  # Rekonstruktion des Datums aus historischen Ordnernamen.
  date_reconstruction:

    # legacy_bash: Bildet das Jahr aus decade_prefix plus Jahresziffer.
    # full_year: Erwartet ein vollständiges vierstelliges Jahr im Ordnernamen.
    mode: legacy_bash

    # Dreistelliges Jahrzehnt-Präfix für legacy_bash.
    # "202" erzeugt zusammen mit einer Jahresziffer ein Jahr von 2020 bis 2029.
    decade_prefix: "202"

    # Nullbasierter Index der Jahresziffer innerhalb des Ordnernamens.
    # Bei "2025-11-02" verweist Index 3 auf "5".
    year_digit_index: 3

# -----------------------------------------------------------------------------
# automation
# Dieser Block steuert ausschließlich lokale KI-Prognosen und ihre Policy.
# Readiness aktiviert keinen Modus; shadow bleibt der sichere Standard.
# -----------------------------------------------------------------------------
automation:
  # policy_version: Version der validierten lokalen Automations-Policy.
  # Mögliche Werte: Nicht-leerer versionsierter String, zum Beispiel "1.0".
  # Auswirkung: Eine leere oder fehlende Version wird fail-closed abgelehnt.
  policy_version: "1.0"

  # mode: Explizit gewählter Betriebsmodus der Automations-Policy.
  # Mögliche Werte: off, shadow, assisted, autophase1, autophase2, fullauto.
  # Auswirkung: shadow und assisted bleiben diagnostisch; operative Modi werden
  # erst in späteren, separat abgesicherten Arbeitspaketen verdrahtet.
  mode: shadow

  # keep_score_min: Mindestwert für eine automatische Keep-Prognose.
  # Mögliche Werte: 0.0 bis 1.0.
  # Auswirkung: Werte >= keep_score_min können als keep prognostiziert werden.
  keep_score_min: 0.90

  # reject_score_max: Höchstwert für eine Reject-Prognose.
  # Mögliche Werte: 0.0 bis 1.0.
  # Auswirkung: Werte <= reject_score_max können als reject prognostiziert werden.
  reject_score_max: 0.15

  # evaluation_window_days: Zeitraum der berücksichtigten Feedback-Daten.
  # Mögliche Werte: 1 bis 365.
  # Auswirkung: Nur Entscheidungen innerhalb dieses Zeitraums werden ausgewertet.
  evaluation_window_days: 90

  # min_evaluated_batches: Mindestzahl vollständig bewerteter Batches.
  # Mögliche Werte: Ganzzahl >= 1.
  # Auswirkung: Unterhalb dieses Werts bleibt eine Automatisierung gesperrt.
  min_evaluated_batches: 10

  # min_evaluated_images: Mindestzahl menschlich bestätigter KI-Prognosen.
  # Mögliche Werte: Ganzzahl >= 1.
  # Auswirkung: Unterhalb dieses Werts bleibt eine Automatisierung gesperrt.
  min_evaluated_images: 500

  # min_overall_agreement: Mindestübereinstimmung aller entscheidbaren Fälle.
  # Mögliche Werte: 0.0 bis 1.0.
  # Auswirkung: Unterhalb dieses Werts ist kein höherer Modus zulässig.
  min_overall_agreement: 0.85

  # min_keep_precision: Mindestpräzision automatischer Keep-Prognosen.
  # Mögliche Werte: 0.0 bis 1.0.
  # Auswirkung: Unterhalb dieses Werts bleibt operative Automation gesperrt.
  min_keep_precision: 0.95

  # min_reject_precision: Mindestpräzision automatischer Reject-Prognosen.
  # Mögliche Werte: 0.0 bis 1.0.
  # Auswirkung: Unterhalb dieses Werts bleibt operative Automation gesperrt.
  min_reject_precision: 0.98

# -----------------------------------------------------------------------------
# phase2
# Review/Rejected-Bereinigung und Transfer nach temp_final.
# -----------------------------------------------------------------------------
phase2:
  # cleanup_review_rejected: Review und Rejected nach Phase 2 bereinigen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true verschiebt Review-/Rejected-Dateien nach temp_error.
  cleanup_review_rejected: true

  # move_to_temp_final: Bereinigten Batch nach temp_final verschieben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true aktiviert den Transfer nach temp_final (Pfad in paths.temp_final).
  move_to_temp_final: true

  # dry_run: Nur simulieren, keine Dateioperationen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true protokolliert nur, false führt Moves tatsächlich aus.
  dry_run: false

# -----------------------------------------------------------------------------
# culling
# Technisches JPG-Culling. ARWs werden niemals still überschrieben oder gelöscht.
# -----------------------------------------------------------------------------
culling:
  # enabled: Generische Bildbewertung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true bewertet JPGs; false führt keine Culling-Entscheidungen aus.
  enabled: true

  # move_files: Ergebnisse in Review oder Rejected verschieben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true führt geprüfte Moves aus; false erzeugt nur Entscheidungen und Reports.
  move_files: true

  # arw_dirname: Name des RAW-Unterordners innerhalb eines Batches.
  # Mögliche Werte: String, üblicherweise ARW.
  # Auswirkung: Dieser Ordner ist der harte Schutzbereich für RAW-Dateien.
  arw_dirname: ARW

  # save_dirname: Name des Save- und Archivordners eines Batches.
  # Mögliche Werte: String, üblicherweise SAVE.
  # Auswirkung: Archive und Berichte werden dort abgelegt.
  save_dirname: SAVE

  # review_dirname: Name des Zielordners für unklare Entscheidungen.
  # Mögliche Werte: String, üblicherweise Review.
  # Auswirkung: Review-Dateien bleiben erhalten und werden nicht verworfen.
  review_dirname: Review

  # rejected_dirname: Name des Zielordners für technische Rejects.
  # Mögliche Werte: String, üblicherweise Rejected.
  # Auswirkung: Rejects bleiben nachvollziehbar getrennt.
  rejected_dirname: Rejected

  # create_review_folder: Review-Ordner bei Bedarf anlegen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true erstellt den Ordner nach Pfadprüfung; false verlangt einen vorhandenen Ordner.
  create_review_folder: true

  # create_rejected_folder: Rejected-Ordner bei Bedarf anlegen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true erstellt den Ordner nach Pfadprüfung; false verlangt einen vorhandenen Ordner.
  create_rejected_folder: true

  # keep_threshold: Mindestscore für keep.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Höhere Werte reduzieren Keep-Entscheidungen.
  keep_threshold: 0.65

  # reject_threshold: Höchstscore für reject.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Niedrigere Werte reduzieren Reject-Entscheidungen.
  reject_threshold: 0.35

  # base_weights: Gewichte der technischen Basisbewertung.
  # Mögliche Werte: Nichtnegative Fließkommazahlen; Summe sollte 1.0 sein.
  # Auswirkung: Bestimmt Einfluss von Schärfe, Ästhetik und Belichtung.
  base_weights:
    sharp: 0.40
    aesth: 0.40
    exposure: 0.20

  # component_weights: Gewichte für den finalen Score.
  # Mögliche Werte: Nichtnegative Fließkommazahlen; Summe sollte 1.0 sein.
  # Auswirkung: Fehlende Komponenten werden vom Adapter normalisiert.
  component_weights:
    base_score: 0.55
    eye_score: 0.10
    aesthetic_reference_score: 0.10
    personal_score: 0.10
    family_score: 0.15

  # reference_scoring: Legacy- und CLI-kompatibler Stilreferenz-Adapter.
  # Mögliche Werte: Konfigurationsblock mit lokalen Pfaden.
  # Auswirkung: Bei vorhandenen Referenzen wird ein Stilprofil erstellt oder erneuert.
  reference_scoring:
    # enabled: Stilreferenz-Scoring aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true nutzt active references; false liefert keinen Referenzscore.
    enabled: true

    # folder: Wurzel des aktiven Stilreferenzpools.
    # Mögliche Werte: Ordner innerhalb von base_dir.
    # Auswirkung: Der aktuelle CLI-Entry-Point liest Bilder aus reference/.
    folder: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/aesthetic_reference/reference

    # recursive: Unterordner des Referenzordners durchsuchen.
    # Mögliche Werte: true oder false.
    # Auswirkung: false beschränkt das Profil auf den direkten reference/-Ordner.
    recursive: false

    # preview_size: Kantenlänge für den kompakten Referenzvergleich.
    # Mögliche Werte: Positive Ganzzahl in Pixeln.
    # Auswirkung: Kleinere Werte sind schneller, größere Werte detaillierter.
    preview_size: 32

    # cache_enabled: Laufzeitprofil wiederverwenden, wenn Referenzen unverändert sind.
    # Mögliche Werte: true oder false.
    # Auswirkung: true spart Rechenzeit; der Cache enthält keine persistenten Embeddings.
    cache_enabled: true

    # cache_dir: Speicherort nicht-sensitiver Cache-Metadaten.
    # Mögliche Werte: Ordner innerhalb von workflow_data_dir/models/reference_scoring.
    # Auswirkung: Änderungen der Referenzen invalidieren diesen Cache.
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/reference_scoring

    # force_cache_rebuild: Rebuild beim nächsten Run erzwingen.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erzeugt Profil neu und muss danach wieder auf false gesetzt werden.
    force_cache_rebuild: false

# -----------------------------------------------------------------------------
# reference_pools
# AP3–AP5-Vertrag: selection.json ist je Pool die alleinige Wahrheit.
# -----------------------------------------------------------------------------
reference_pools:
  # common: Gemeinsame Hard- und Soft-Limits aller Referenzpools.
  common:
    # max_active: Harte Obergrenze aktiver Referenzen.
    # Mögliche Werte: Positive Ganzzahl.
    # Auswirkung: Weitere Aktivierung wird blockiert.
    max_active: 100

    # min_active: Weiche Mindestgröße eines aktiven Adapters.
    # Mögliche Werte: 0 bis max_active.
    # Auswirkung: Der betroffene Adapter pausiert bei Unterschreitung.
    min_active: 5

    # target_active: Angestrebte aktive Poolgröße.
    # Mögliche Werte: min_active bis max_active.
    # Auswirkung: Abweichungen werden als User-Action berichtet.
    target_active: 30

    # max_new: Harte Obergrenze offener Vorschläge.
    # Mögliche Werte: Nichtnegative Ganzzahl.
    # Auswirkung: Eine volle Queue blockiert neue Vorschläge.
    max_new: 20

    # max_new_per_batch: Harte Vorschlagsgrenze je Batch.
    # Mögliche Werte: 0 bis max_new.
    # Auswirkung: Verhindert Vorschlagsfluten.
    max_new_per_batch: 5

    # rename_active_references: Aktive Referenzen mit AP4-Namensplan umbenennen.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt ausschließlich einen validierten Rename-Plan.
    rename_active_references: true

    # active_filename_template: Deterministisches Namensschema aktiver Referenzen.
    # Mögliche Werte: Template mit rank, stem, suffix und ext.
    # Auswirkung: Aktive Dateinamen werden reproduzierbar erzeugt.
    active_filename_template: "{rank}__{stem}__{suffix}{ext}"

  # aesthetic_reference: Allgemeine Stil- und Qualitätsreferenzen.
  aesthetic_reference:
    # enabled: Stilpool aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt Stilscore und Vorschläge; false pausiert nur diesen Adapter.
    enabled: true
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/aesthetic_reference
    reference_dirname: reference
    new_dirname: new_refs
    selection_filename: selection.json
    min_quality_score: 0.70
    max_redundancy: 0.90
    preview_size: 32
    cache_enabled: true
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/reference_scoring
    auto_rebuild_on_active_change: true
    force_cache_rebuild: false

  # personal_training: Bewusst aktivierte Lieblingsbilder.
  personal_training:
    # enabled: Persönlichen Pool aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt persönlichen Score und Trainingsvorschläge.
    enabled: true
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/personal_training
    reference_dirname: reference
    new_dirname: new_refs
    selection_filename: selection.json
    min_quality_score: 0.70
    max_redundancy: 0.90
    cache_enabled: true
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste
    auto_rebuild_on_active_change: true
    force_cache_rebuild: false

  # faces: Personenpools; Ordnernamen müssen exakt den Slugs entsprechen.
  faces:
    # enabled: Face-Pools aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true erlaubt Face-Vorschläge; eine leere reference/-Map pausiert nur die Person.
    enabled: true
    root_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/faces
    reference_dirname: reference
    new_dirname: new_faces
    selection_filename: selection.json
    min_quality_score: 0.70
    max_redundancy: 0.95
    crop_size: 256
    min_face_size: 128
    cache_enabled: true
    cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/family_faces
    auto_rebuild_on_active_change: true
    force_cache_rebuild: false

# -----------------------------------------------------------------------------
# family_recognition
# DYNAMISCH: Alle Ordner in faces/ werden als Personen betrachtet
# -----------------------------------------------------------------------------
family_recognition:
  # enabled: Gesichtserkennung aktivieren
  # Mögliche Werte: true oder false.
  # Auswirkung: true aktiviert Face-Erkennung; false deaktiviert.
  enabled: true

  # reference_dir: Wurzel aller Personenslugs.
  # Mögliche Werte: Ordner innerhalb von base_dir.
  # Auswirkung: Fehlt dieser Pfad, meldet Phase 1 reference_dir_missing.
  reference_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/faces

  # cache_dir: Speicherort ausschließlich für nicht-sensitive Cache-Metadaten.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/models/family_faces.
  # Auswirkung: Referenz-Fingerprints und Laufstatus dürfen persistieren,
  #             Embeddings dürfen dort niemals gespeichert werden.
  cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/family_faces

  # cache_enabled: Cache-Metadaten verwenden.
  # Mögliche Werte: true oder false.
  # Auswirkung: true vermeidet unnötige Rebuilds bei unveränderten Referenzen.
  cache_enabled: true

  # cache_rebuild_mode: Rebuild-Strategie.
  # Mögliche Werte: incremental oder full.
  # Auswirkung: incremental reagiert auf Änderungen; full baut beim nächsten Run vollständig neu.
  cache_rebuild_mode: incremental

  # auto_rebuild_on_reference_change: Rebuild bei Erstbetrieb oder Referenzänderung.
  # Mögliche Werte: true oder false.
  # Auswirkung: true ist der Betriebsdefault; ein separater rebuild-family-cache-Run bleibt optional.
  auto_rebuild_on_reference_change: true

  # force_cache_rebuild: Vollständigen Rebuild beim nächsten Lauf erzwingen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true nur einmal setzen, danach wieder false; überschreibt keinen gültigen Pool.
  force_cache_rebuild: false

  # protect_detected_family: Treffer mindestens vor automatischem Reject schützen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true routet unsichere Treffer zu Review statt Reject.
  protect_detected_family: true

  # default_person_weight: Standardgewicht fur NICHT konfigurierte Personen
  # Mögliche Werte: Fließ·kommazahl von 0.0 bis 1.0.
  # Auswirkung: Alle Ordner ohne explizites Gewicht erhalten diesen Wert.
  # BEISPIEL: "EXAMPLE_PERSON" bekommt 0.35, wenn nicht explizit konfiguriert.
  default_person_weight: 0.35

  # match_tolerance: Maximale akzeptierte Face-Distanz.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Kleinere Werte verringern Fehlmatches, erhöhen aber Nicht-Treffer.
  match_tolerance: 0.45

  # min_reference_images_per_person: Mindestzahl aktiver Referenzen pro Person.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Leere Pools, etwa kind2 oder mutter, pausieren nur den jeweiligen Adapter.
  min_reference_images_per_person: 3

  # max_reference_images_per_person: Harte Obergrenze aktiver Referenzen je Person.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Begrenzt Laufzeit und Poolgröße.
  max_reference_images_per_person: 100

  # person_weights: OPTIONALE Gewichte fur BEKANNTE Personen
  # Mögliche Werte: Slug -> Fließ·kommazahl von 0.0 bis 1.0.
  # Auswirkung: Uberschreibt default_person_weight fur die jeweilige Person.
  # WICHTIG: Nur bekannte Slugs eintragen! Neue Ordner automatisch mit Default.
  # BEISPIEL: "chris" ist bekannt, "EXAMPLE_PERSON" bekommt Default (0.35).
  person_weights:
    chris: 0.35
    daniel: 0.35
    kind1: 0.55
    kind2: 0.55
    michele: 0.35
    mutter: 0.35
    nelly: 0.35
    oma: 0.30
    opa: 0.30
    vater: 0.35

  # write_native_tags: Personen-Tags per ExifTool schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt nur nach validierter Entscheidung und Readback.
  write_native_tags: true

  # write_face_regions: Gesichtsregionen schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true nur verwenden, wenn der aktive Adapter diese Metadaten unterstützt.
  write_face_regions: true

  # exiftool_path: ExifTool ohne Shell-Interpolation ausführen.
  # Mögliche Werte: PATH-Name oder absoluter Pfad.
  # Auswirkung: Fehlendes Tool wird gemeldet; es darf keine Dateioperation auslösen.
  exiftool_path: exiftool

# -----------------------------------------------------------------------------
# personal_scoring
# Persönlicher Geschmackspool. Der erste Betrieb darf ohne Referenzen starten.
# -----------------------------------------------------------------------------
personal_scoring:
  # enabled: Persönliche Bewertung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true nutzt den Adapter erst ab ausreichenden active references.
  enabled: true

  # source_dir: Aktiver persönlicher Referenzordner.
  # Mögliche Werte: Ordner innerhalb von base_dir.
  # Auswirkung: Fehlt oder ist er leer, pausiert nur personal_score.
  source_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/personal_training/reference

  # model_path: Modellartefakt für persönlichen Score.
  # Mögliche Werte: Datei innerhalb von workflow_data_dir/models/taste.
  # Auswirkung: Kann beim ersten Training erzeugt werden; keine Secrets enthalten.
  model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste/user_taste_model.json

  # cache_dir: Cache-Metadaten des persönlichen Adapters.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/models/taste.
  # Auswirkung: Änderungen aktiver Referenzen invalidieren den Cache.
  cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/taste

  # cache_enabled: Cache-Metadaten verwenden.
  # Mögliche Werte: true oder false.
  # Auswirkung: true vermeidet unnötige Berechnungen.
  cache_enabled: true

  # auto_train_on_change: Bei Referenzänderung neu trainieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true startet nach validierter Änderung automatisch einen sicheren Rebuild.
  auto_train_on_change: true

  # min_reference_images: Mindestmenge aktiver Lieblingsbilder.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Unterhalb dieses Limits pausiert nur personal_score.
  min_reference_images: 5

  # force_cache_rebuild: Vollständigen Rebuild des persönlichen Caches beim nächsten Lauf erzwingen.
  # Mögliche Werte: true oder false.
  # Auswirkung: true nur einmal setzen, danach wieder false.
  force_cache_rebuild: false

  # recursive: Persönliche Referenzunterordner durchsuchen.
  # Mögliche Werte: true oder false.
  # Auswirkung: false berücksichtigt nur den direkten Referenzordner.
  recursive: false

# -----------------------------------------------------------------------------
# models
# Lokale Modellgewichte. network-Zugriff und automatische Downloads bleiben gesperrt.
# -----------------------------------------------------------------------------
models:
  clip:
    # enabled: CLIP als zusätzliche AP6-Scorekomponente aktivieren.
    # Mögliche Werte: true oder false.
    # Auswirkung: true benötigt einen vollständigen lokalen Modellordner; false hält CLIP im Shadow/Off-Modus.
    enabled: false
    backend: transformers
    model_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/clip
    local_files_only: true
    device: auto

  face_detection:
    backend: opencv
    model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/face/face_detection_yunet_2023mar.onnx
    confidence_threshold: 0.65
    max_input_side: 1600
    nms_threshold: 0.30
    top_k: 5000
    min_face_size: 128

  face_recognition:
    backend: opencv
    model_path: ../NAS_EXAMPLE/WORKFLOW_DATA/models/face/face_recognition_sface_2021dec.onnx
    distance_metric: cosine
    match_tolerance: 0.60

# -----------------------------------------------------------------------------
# series_detection
# Best-of-Ermittlung; Nicht-Bestbilder werden standardmäßig nur zur Review gegeben.
# -----------------------------------------------------------------------------
series_detection:
  # enabled: Serienerkennung einschalten.
  # Mögliche Werte: true oder false.
  # Auswirkung: true gruppiert zeitlich, numerisch und visuell ähnliche Bilder.
  enabled: true
  exif_time_enabled: true
  time_window_seconds: 8
  filename_sequence_enabled: true
  max_filename_gap: 2
  min_sequence_images: 2
  visual_clustering_enabled: true
  cluster_eps: 0.18
  min_samples: 2
  preview_size: 32
  review_margin: 0.03

  # demote_non_best_to: Zielstatus nicht bester Serienbilder.
  # Mögliche Werte: review oder reject.
  # Auswirkung: review erhält die Bilder; reject ist nur nach bewusster Freigabe zulässig.
  demote_non_best_to: review

# -----------------------------------------------------------------------------
# training
# Lokale Trainingspfade für den optionalen persönlichen Geschmacksadapter.
# Alle Daten bleiben innerhalb von WORKFLOW_DATA.
# -----------------------------------------------------------------------------
training:
  # sample_images_dir: Kompatibilitätspfad für train-personal.
  # Mögliche Werte: Ordner innerhalb von base_dir.
  # Auswirkung: Der CLI-Trainingslauf verwendet diesen Pfad bei fehlendem Argument.
  sample_images_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/personal_training/reference

  # exported_labels_dir: Zielordner für exportierte Trainingslabels.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir.
  # Auswirkung: Labels werden revisionsfähig getrennt von Bilddateien abgelegt.
  exported_labels_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/training/exported_labels

  # runs_dir: Zielordner für Trainingslauf-Artefakte.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir.
  # Auswirkung: Technische Trainingsergebnisse bleiben im erlaubten Datenbereich.
  runs_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/training/runs

  # min_labeled_images: Mindestzahl gelabelter Bilder für einen Trainingslauf.
  # Mögliche Werte: Positive Ganzzahl.
  # Auswirkung: Unterhalb des Werts blockiert der Trainingsadapter den Start.
  min_labeled_images: 20

# -----------------------------------------------------------------------------
# metadata_culling
# Namespaced Metadaten. ExifTool muss mit shell=False arbeiten und zurücklesen.
# -----------------------------------------------------------------------------
metadata_culling:
  # enabled: Metadaten-Culling aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt ausschließlich freigegebene Workflow-Metadaten.
  enabled: true

  # write_rating: Sternebewertung schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt die validierte Bewertungsstufe.
  write_rating: true

  # write_keywords: Namespaced Keywords schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt workflow:, decision:, series:, family: und person:.
  write_keywords: true

  # write_score_bands: Scorebereiche als Metadaten schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true schreibt Score-Bänder, false schreibt keine Score-Bänder.
  write_score_bands: true

  # write_raw_scores_to_keywords: Rohscores als Keywords schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: false verhindert die Persistenz detaillierter Rohscore-Werte.
  write_raw_scores_to_keywords: false

  # keep_backup: ExifTool-Backupdateien behalten.
  # Mögliche Werte: true oder false.
  # Auswirkung: false entfernt ExifTool-Backups nach erfolgreicher Rückprüfung.
  keep_backup: false

  # exiftool_path: Lokaler ExifTool-Aufruf.
  # Mögliche Werte: PATH-Name oder absoluter Pfad.
  # Auswirkung: Fehlendes ExifTool wird als Status gemeldet; keine Shell wird gestartet.
  exiftool_path: exiftool

  # keyword_schema: Namespaced Keyword-Vertrag.
  # Mögliche Werte: namespaced_v1.
  # Auswirkung: Verhindert Kollisionen mit fremden Metadaten.
  keyword_schema: namespaced_v1

# -----------------------------------------------------------------------------
# manual_keep
# Manuelle Keep-Entscheidungen haben Vorrang vor jeder automatischen Bewertung.
# AP8-Vertrag: Inbox/Used-Logik für idempotente Zuordnung.
# Feature-Vektor-basiertes Matching (nicht Dateiname).
# -----------------------------------------------------------------------------
manual_keep:
  # enabled: MANUAL_KEEP-Verarbeitung aktivieren.
  # Mögliche Werte: true oder false.
  # Auswirkung: true aktiviert die Prüfung auf manuell geschutzte Bilder vor dem Culling.
  #           false deaktiviert MANUAL_KEEP komplett; alle Bilder unterliegen der automatischen Bewertung.
  enabled: true

  # inbox_dir: Eingang für manuell geschutzte Bilder.
  # Mögliche Werte: Ordner innerhalb von base_dir.
  # Auswirkung: Bilder, deren Dateinamen in diesem Ordner liegen, werden zwingend als KEEP markiert.
  #           Der Ordner muss existieren; bei Fehlen wird MANUAL_KEEP still ubersprungen.
  # Voraussetzung: Ordnerstruktur MANUAL_KEEP/inbox/BATCH_NAME/ oder MANUAL_KEEP/inbox/IMAGE.JPG
  inbox_dir: ../NAS_EXAMPLE/MANUAL_KEEP/inbox

  # used_dir: Bereits idempotent zugeordnete Manual-Keep-Quellen.
  # Mögliche Werte: Ordner innerhalb von base_dir.
  # Auswirkung: Nach erfolgreicher Phase-1-Verarbeitung werden inbox-Bilder hierhin verschoben.
  #           Verhindert doppelte Zuordnung derselben Quelle bei wiederholten Läufen.
  # Hinweis: Der Ordner wird bei Bedarf automatisch erstellt.
  used_dir: ../NAS_EXAMPLE/MANUAL_KEEP/used

  # locks_dir: Lock-Verzeichnis für AP8-Idempotenz.
  # Mögliche Werte: Ordner innerhalb von MANUAL_KEEP.
  # Auswirkung: Verhindert parallele Zuordnungen desselben Bildes.
  #           Jede Zuordnung erhält einen zeitlich begrenzten Lock.
  # Hinweis: Wird intern verwendet; manuelle Eingriffe sind nicht erforderlich.
  locks_dir: ../NAS_EXAMPLE/MANUAL_KEEP/.locks

  # recovery_log: Recovery-Log für MANUAL_KEEP-Zuordnungen.
  # Mögliche Werte: Datei innerhalb von MANUAL_KEEP.
  # Auswirkung: Protokolliert Zuordnungen und ermöglicht Wiederherstellung nach Fehlern.
  #           Enthalt Assignment-IDs, Zeitstempel und User-Informationen.
  # Hinweis: Wird intern verwendet; Format ist JSON.
  recovery_log: ../NAS_EXAMPLE/MANUAL_KEEP/.recovery_info.json

  # similarity_threshold: Minimale Ähnlichkeit für MANUAL_KEEP-Match.
  # Mögliche Werte: Fließkommazahl von 0.0 bis 1.0.
  # Auswirkung: Höhere Werte reduzieren False Positives, können aber echte Treffer verpassen.
  # Empfehlung: 0.85 für striktes Matching, 0.75 für tolerantes Matching.
  # Testwert: 0.85
  similarity_threshold: 0.85

# -----------------------------------------------------------------------------
# reporting
# Reports enthalten ausschließlich Metadaten, Pfade, Status und Scores.
# 98AP-Regeln: Keine Bildbytes, Embeddings oder Secrets in Reports.
# -----------------------------------------------------------------------------
reporting:
  # write_json_summary: JSON-Laufzusammenfassung schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true erzeugt eine nicht-binä·¨re JSON-Datei mit Status, Hashes und Handlungsbedarf.
  #           false erzeugt keine JSON-Summary; nur CSV und Terminal-Ausgabe.
  # Hinweis: true empfohlen für Auditierbarkeit und Scheduler-Integration.
  write_json_summary: true

  # write_csv_scores: Scorezeilen als CSV schreiben.
  # Mögliche Werte: true oder false.
  # Auswirkung: true erzeugt eine CSV-Datei mit allen Scores und Entscheidungen pro Bild.
  #           false erzeugt keine CSV; nur JSON-Summary und Terminal-Ausgabe.
  # Hinweis: CSV enthält keine Bildbytes oder Embeddings; nur Metadaten und Scores.
  write_csv_scores: true

  # json_summary_dir: Ordner für nicht-binä·¨re Laufzusammenfassungen.
  # Mögliche Werte: Ordner innerhalb von workflow_data_dir/runtime.
  # Auswirkung: true bei write_json_summary schreibt Reports nur in diesen Ordner.
  #           Der Ordner wird bei Bedarf automatisch erstellt.
  # Hinweis: Reports sind revisionsfä·¨hig und enthalten Config-Fingerprint, Hashes und Zeitstempel.
  json_summary_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/run_summaries

  # stdout_mode: Ausgabeformat für Scheduler/Administration.
  # Mögliche Werte: scheduler_mail.
  # Auswirkung: Formatiert den Abschlussreport für Scheduler-Mailaufbereitung.
  #           Andere Modi sind derzeit nicht implementiert.
  # Hinweis: Dieser Wert beeinflusst nur die Terminal-Ausgabe, nicht die Datei-Reports.
  stdout_mode: scheduler_mail

  # require_user_actions_required: Handlungsbedarf explizit melden.
  # Mögliche Werte: true oder false.
  # Auswirkung: true meldet volle Queues und Recovery-Aufgaben als User-Actions.
  #           false unterdruckt diese Meldungen; nur Status und Counts werden ausgegeben.
  # Hinweis: true empfohlen für vollständige Transparenz und manuelle Nachsteuerung.
  require_user_actions_required: true
  
# -----------------------------------------------------------------------------
# Optionales lokales CLIP-Scoring für den persönlichen Geschmack.
# Standardmäßig deaktiviert: Aktivierung erst nach erfolgreichem Pilotbetrieb.
# -----------------------------------------------------------------------------
clip_scoring:

  # Aktiviert zusätzliche CLIP-Diagnostik im Culling-Report.
  # false: keine CLIP-Inferenz und keine Änderung bestehender Scores.
  # true: berechnet clip_personal_score als zusätzliches Analysefeld.
  enabled: false

  # Lokaler Pfad eines vollständig vorhandenen Transformers-CLIP-Modells.
  # Der Workflow lädt nur lokal und führt keinen Modell-Download durch.
  model_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/models/clip

  # Referenzordner für optionale ästhetische CLIP-Analysen.
  # Fehlt oder ist er leer, bleibt clip_aesthetic_score nicht verfügbar.
  aesthetic_reference_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/aesthetic_reference

  # Aktive persönliche CLIP-Referenzbilder.
  # Inhalts-, Pfad-, Hinzufügungs- und Entfernungsänderungen invalidieren
  # den Referenz-Embedding-Cache automatisch.
  personal_reference_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/samples/personal_training/reference

  # Kontrollierter Runtime-Ordner für den Referenz-Embedding-Cache.
  # Der Cache liegt nicht im Repository und verändert keine Bilddateien.
  cache_dir: ../NAS_EXAMPLE/WORKFLOW_DATA/runtime/scoring

  # true: Keine reale CLIP-Inferenz; Scores bleiben None.
  # false: Das lokale CLIP-Modell erzeugt reale Bild-Embeddings.
  # Für einen Shadow-Pilot zunächst auf true lassen.
  shadow_mode: true

# -----------------------------------------------------------------------------
# extensions
# Erweiterungen dürfen nur hier ergänzt werden. Unbekannte Top-Level-Schlüssel
# sind nach 98AP ein Validierungsfehler.
# -----------------------------------------------------------------------------
extensions: {}
